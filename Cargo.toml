[workspace]
members = [
    "crates/nova-cli",
    "crates/nova-diagnostics",
    "crates/nova-inspect",
    "crates/nova-int-semantics",
    "crates/nova-interpreter",
    "crates/nova-lexer",
    "crates/nova-parser",
    "crates/nova-sema",
    "crates/nova-source",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Nova contributors"]
repository = "https://github.com/Lei-TzuY/Nova"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
