[package]
name = "nova-cli"
description = "Official bootstrap command-line frontend for the Nova language"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nova"
path = "src/main.rs"

[dependencies]
nova-diagnostics = { path = "../nova-diagnostics" }
nova-inspect = { path = "../nova-inspect" }
nova-interpreter = { path = "../nova-interpreter" }
nova-lexer = { path = "../nova-lexer" }
nova-parser = { path = "../nova-parser" }
nova-sema = { path = "../nova-sema" }
nova-source = { path = "../nova-source" }

[lints]
workspace = true
