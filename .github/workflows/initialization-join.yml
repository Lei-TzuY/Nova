name: Apply initialization join refactor

on:
  push:
    branches:
      - refactor/initialization-join

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/initialization-join
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply dataflow refactor
        run: python3 scripts/apply_initialization_join.py
      - name: Validate semantic crate
        run: |
          cargo fmt --all
          cargo test -p nova-sema --all-targets --locked
          cargo clippy -p nova-sema --all-targets --all-features -- -D warnings
      - name: Commit refactor and remove helpers
        run: |
          rm .github/workflows/initialization-join.yml scripts/apply_initialization_join.py
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "refactor: centralize initialization joins"
          git push origin HEAD:refactor/initialization-join
