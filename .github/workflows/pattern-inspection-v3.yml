name: Pattern inspection v3

on:
  push:
    branches:
      - feat/pattern-payload-discard
    paths:
      - .github/pattern-inspection-v3.py
      - .github/fix-pattern-inspection-v3.py
      - .github/adapt-v3-cli-unit.py
      - .github/workflows/pattern-inspection-v3.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pattern-payload-discard
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply and validate inspection v3
        shell: bash
        run: |
          set -euo pipefail
          python .github/fix-pattern-inspection-v3.py
          python .github/pattern-inspection-v3.py
          python .github/adapt-v3-cli-unit.py
          cargo fmt --all
          cargo test -p nova-inspect --test pattern_payload_discard
          cargo test -p nova-inspect
          cargo test -p nova-cli
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git rm -f .github/pattern-inspection-v3.py .github/fix-pattern-inspection-v3.py \
            .github/adapt-v3-cli-unit.py .github/workflows/pattern-inspection-v3.yml
          git add crates/nova-inspect/src/lib.rs crates/nova-inspect/src/v3.rs \
            crates/nova-inspect/tests/pattern_payload_discard.rs docs/schemas/semantic-inspection-v3.schema.json \
            crates/nova-cli/src/main.rs crates/nova-cli/tests/cli.rs \
            crates/nova-cli/tests/fixtures/valid/pattern-payload-discard.nv
          git commit -m "feat: add semantic inspection v3 for pattern modes"
          git push origin HEAD:feat/pattern-payload-discard
