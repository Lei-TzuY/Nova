name: BIL-34 Final Runtime Fix

on:
  push:
    branches:
      - conquest/bil-34-generic-functions

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/bil-34-generic-functions
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python .github/bil34_finalfix.py
      - run: cargo fmt --all
      - run: cargo test -p nova-cli --test generic_functions --locked
      - run: cargo test -p nova-interpreter --test nominal_type_identity --locked
      - run: cargo test --workspace --all-targets --locked
      - name: Commit final runtime fix
        run: |
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "fix: preserve nominal validation for generic runtime values"
          git push origin HEAD:conquest/bil-34-generic-functions
