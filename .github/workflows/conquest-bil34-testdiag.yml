name: BIL-34 Runtime Fix

on:
  push:
    branches:
      - conquest/bil-34-generic-functions

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/bil-34-generic-functions
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Preserve rigid generic function identity at runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/nova-interpreter/src/lib.rs')
          text = p.read_text()
          old = '''    fn value_conforms_to_type(&self, value: &Value, ty: &Type) -> bool {
                  if !self.type_is_runtime_valid(ty) {
                      return false;
                  }
                  if let Type::TypeParameter(name) = ty {'''
          new = '''    fn value_conforms_to_type(&self, value: &Value, ty: &Type) -> bool {
                  // A generic function symbol is a valid runtime value before call-site
                  // instantiation. Concrete `T` validation begins inside `call_function`.
                  if let (Value::Function(id), Type::Function(expected)) = (value, ty) {
                      if id.module() == self.program.module.id {
                          if let Some(function) = self.program.functions.get(id.index()) {
                              let signature_matches = function.id == *id
                                  && function.parameters.len() == expected.parameters.len()
                                  && function
                                      .parameters
                                      .iter()
                                      .zip(&expected.parameters)
                                      .all(|(parameter, expected_type)| &parameter.ty == expected_type)
                                  && &function.return_type == expected.return_type.as_ref();
                              if signature_matches {
                                  return true;
                              }
                          }
                      }
                  }
                  if !self.type_is_runtime_valid(ty) {
                      return false;
                  }
                  if let Type::TypeParameter(name) = ty {'''
          assert old in text
          p.write_text(text.replace(old, new, 1))

          p = Path('docs/grammar.md')
          text = p.read_text()
          text = text.replace('planned ownership, effects, concurrency, generics, macros, modules, FFI, or', 'planned ownership, effects, concurrency, macros, modules, FFI, or', 1)
          p.write_text(text)

          for helper in [
              Path('.github/workflows/conquest-bil34-testdiag.yml'),
              Path('.github/bil34-diag-trigger'),
              Path('.github/bil34-test-error.txt'),
          ]:
              if helper.exists():
                  helper.unlink()
          PY
      - run: cargo fmt --all
      - run: cargo test -p nova-cli --test generic_functions --locked
      - run: cargo test --workspace --all-targets --locked
      - name: Commit runtime fix
        run: |
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "fix: validate rigid generic function values"
          git push origin HEAD:conquest/bil-34-generic-functions
