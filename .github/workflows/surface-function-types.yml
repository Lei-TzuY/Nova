name: Surface function types

on:
  push:
    branches:
      - feat/surface-function-types
    paths:
      - .github/surface-function-types.py
      - .github/fix-surface-function-script.py
      - .github/adapt-surface-function-parser-tests.py
      - .github/workflows/surface-function-types.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/surface-function-types
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply and validate surface function types
        shell: bash
        run: |
          set -euo pipefail
          python .github/fix-surface-function-script.py
          python .github/surface-function-types.py
          python .github/adapt-surface-function-parser-tests.py
          cargo fmt --all
          cargo test -p nova-parser --test function_types
          cargo test -p nova-sema --test surface_function_types
          cargo test -p nova-cli --test cli
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git rm -f .github/surface-function-types.py .github/fix-surface-function-script.py \
            .github/adapt-surface-function-parser-tests.py .github/workflows/surface-function-types.yml
          git add crates/nova-parser/src/ast.rs crates/nova-parser/src/parser.rs \
            crates/nova-parser/tests/function_types.rs \
            crates/nova-sema/src/analyzer.rs crates/nova-sema/tests/surface_function_types.rs \
            crates/nova-cli/tests/cli.rs crates/nova-cli/tests/fixtures/valid/higher-order-functions.nv
          git commit -m "feat: add surface function types"
          git push origin HEAD:feat/surface-function-types
