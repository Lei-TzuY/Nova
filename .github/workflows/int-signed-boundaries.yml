name: Validate signed Int boundaries

on:
  push:
    branches:
      - feat/int-signed-boundaries

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/int-signed-boundaries
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Compile new regression target
        run: cargo test -p nova-sema --test integer_boundaries --locked --no-run
      - name: Confirm signed boundary regression is red
        shell: bash
        run: |
          if cargo test -p nova-sema --test integer_boundaries --locked; then
            echo "expected signed Int boundary regressions to fail before the fix" >&2
            exit 1
          fi
      - name: Apply signed Int boundary slice
        run: |
          python3 scripts/apply_int_signed_boundaries.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/roadmap.md')
          text = path.read_text()
          old = '**Status: twenty vertical slices implemented; broader type-system work remains.**'
          new = '**Status: twenty-one vertical slices implemented; broader type-system work remains.**'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Phase 2 status marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate fixed numeric slice
        run: |
          cargo fmt --all
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Commit fix and remove helpers
        run: |
          rm .github/workflows/int-signed-boundaries.yml scripts/apply_int_signed_boundaries.py
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "feat: cover signed Int literal boundaries"
          git push origin HEAD:feat/int-signed-boundaries
