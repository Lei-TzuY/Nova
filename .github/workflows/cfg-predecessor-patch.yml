name: CFG predecessor canonicality patch

on:
  push:
    branches:
      - fix/cfg-predecessor-canonicality

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cfg-predecessor-canonicality
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply and validate CFG predecessor canonicality
        shell: bash
        run: |
          set -euo pipefail
          python .github/cfg_predecessor_patch.py
          cargo fmt --all
          cargo test -p nova-sema --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          rm .github/cfg_predecessor_patch.py .github/workflows/cfg-predecessor-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: enforce CFG predecessor canonicality'
          git push origin HEAD:fix/cfg-predecessor-canonicality
