name: Binding reference identity patch

on:
  push:
    branches:
      - fix/binding-reference-identity
    paths:
      - .github/binding-reference-identity-patch.py
      - .github/workflows/binding-reference-identity-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/binding-reference-identity
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply and validate binding reference identity patch
        run: |
          python .github/binding-reference-identity-patch.py
          cargo fmt --all
          cargo test -p nova-sema --test binding_reference_identity --locked
          cargo test -p nova-interpreter --test binding_reference_identity --locked
          cargo test -p nova-inspect --test binding_reference_identity --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          rm .github/binding-reference-identity-patch.py
          rm .github/workflows/binding-reference-identity-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve resolved binding reference identity"
          git push origin HEAD:fix/binding-reference-identity
