name: Validate shared Int semantics after introspection

on:
  push:
    branches:
      - refactor/shared-int-semantics

permissions:
  contents: write

jobs:
  rebase-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Confirm introspection-aware duplicated baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'crates/nova-inspect' Cargo.toml
          grep -q 'serde_json' Cargo.toml
          test -f crates/nova-interpreter/src/int_semantics.rs
          grep -q 'checked_add' crates/nova-interpreter/src/int_semantics.rs
          grep -q 'checked_add' crates/nova-sema/src/constant_int.rs
          grep -q 'left == i64::MIN && right == -1' crates/nova-interpreter/src/int_semantics.rs
          grep -q 'left == i64::MIN && right == -1' crates/nova-sema/src/constant_int.rs
          if grep -q 'crates/nova-int-semantics' Cargo.toml; then
            echo "shared numeric crate unexpectedly integrated before rebase patch" >&2
            exit 1
          fi
      - name: Apply shared arithmetic union
        run: python scripts/apply_shared_int_semantics_rebase.py
      - name: Regenerate merged lockfile
        run: cargo generate-lockfile
      - name: Confirm single-policy structure and introspection preservation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e crates/nova-interpreter/src/int_semantics.rs
          grep -q 'crates/nova-inspect' Cargo.toml
          grep -q 'crates/nova-int-semantics' Cargo.toml
          grep -q 'serde_json' Cargo.toml
          grep -q 'nova-int-semantics' crates/nova-sema/Cargo.toml
          grep -q 'nova-int-semantics' crates/nova-interpreter/Cargo.toml
          grep -q 'nova_int_semantics::add' crates/nova-sema/src/constant_int.rs
          grep -q 'use nova_int_semantics as int_semantics' crates/nova-interpreter/src/lib.rs
          grep -q 'nova-inspect' crates/nova-cli/Cargo.toml
          grep -q 'Command::Inspect' crates/nova-cli/src/main.rs
          if grep -q 'checked_add' crates/nova-sema/src/constant_int.rs; then
            echo "semantic preflight still owns arithmetic policy" >&2
            exit 1
          fi
          test "$(grep -R --include='*.rs' -l 'fn classify_divisor' crates | wc -l)" -eq 1
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Validate behavior preservation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Commit rebased refactor and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/shared-int-semantics-rebase.yml scripts/apply_shared_int_semantics_rebase.py
          git add -A
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git commit -m "refactor: share bootstrap Int semantics"
          git push origin HEAD:refactor/shared-int-semantics
