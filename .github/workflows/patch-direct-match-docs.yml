name: Patch direct-match docs

on:
  push:
    branches:
      - feat/direct-match-dataflow

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/direct-match-dataflow
      - name: Synchronize semantic documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              path.write_text(text.replace(old, new))

          readme = Path("README.md")
          anchor = """A direct `if true` or `if false` refines control-flow reachability without
turning the checker into a general constant folder. Only the selected branch may
contribute definite-initialization, non-continuation, or loop-exit facts; the
unselected branch is still lowered for deterministic static diagnostics and still
participates in branch type compatibility. Block-valued or computed Boolean
conditions keep the ordinary conservative two-branch merge.
"""
          replace_once(readme, anchor, anchor + """
A `match` whose lowered scrutinee is itself a successfully typed direct enum
constructor, such as `Result::Value(40)`, receives the same narrow reachability
refinement. Only the arm for that constructed variant may contribute reachable
definite-initialization, non-continuation, or loop-exit facts. Every arm remains
subject to pattern, payload, exhaustiveness, duplicate-variant, name, and type
checking, and all arm result types must still be compatible. Matches over locals,
parameters, calls, blocks, or other computed enum values retain the ordinary
conservative all-arm flow merge.
""")

          constitution = Path("docs/language-constitution.md")
          anchor = """A direct Boolean-literal `if` is another provisional reachability refinement.
For `if true`, only the then branch contributes reachable flow facts; for
`if false`, only the else branch does. The unselected branch remains fully
subject to name and type diagnostics, including branch type compatibility, but
its assignments, returns, and loop transfers cannot affect reachable continuation
state. Computed and block-valued Boolean conditions keep the ordinary two-branch
merge; this rule is not general constant folding.
"""
          replace_once(constitution, anchor, anchor + """
A valid exhaustive `match` receives an equally narrow refinement only when its
lowered scrutinee is a directly constructed, successfully typed enum variant.
The arm for that variant is the sole source of reachable assignment,
non-continuation, and loop-exit facts; every other arm is lowered for diagnostics
without mutating reachable flow state. Pattern validity, payload bindings,
duplicate detection, exhaustiveness, and arm type compatibility still consider
the complete match. Any computed enum scrutinee keeps the conservative merge over
all continuing arms; constructor recognition is not general value propagation.
""")

          roadmap = Path("docs/roadmap.md")
          anchor = """- analyzer adversarial tests plus CLI check/run fixtures lock selected/dead
  initialization and loop-control behavior end to end.

The next Phase 2 slices should address semantic depth rather than widen syntax
"""
          replacement = """- analyzer adversarial tests plus CLI check/run fixtures lock selected/dead
  initialization and loop-control behavior end to end.

Implemented in the tenth Phase 2 slice:

- a successfully typed direct enum-constructor scrutinee exposes its resolved
  variant slot to semantic match reachability without adding constant folding;
- only the selected constructor arm contributes reachable definite-initialization,
  non-continuation, and loop-exit facts;
- unselected arms remain fully checked for pattern/payload validity, duplicate
  variants, exhaustiveness, names, and arm type compatibility while their flow
  mutations are discarded;
- matches over parameters, locals, calls, blocks, and other computed enum values
  retain the existing conservative merge across continuing arms;
- payload-carrying direct constructors preserve the selected arm's immutable
  payload binding while still refining outer flow state; and
- analyzer adversarial tests plus CLI check/run fixtures lock initialization,
  payload, return, loop-exit, dead-arm diagnostic, and dynamic-match behavior.

The next Phase 2 slices should address semantic depth rather than widen syntax
"""
          replace_once(roadmap, anchor, replacement)
          PY
      - name: Commit documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/language-constitution.md docs/roadmap.md
          git commit -m "docs: specify direct-match semantic reachability"
          git push origin HEAD:feat/direct-match-dataflow
