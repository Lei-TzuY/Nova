name: Patch direct match docs
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/direct-match-dataflow
      - name: Patch documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              path.write_text(text.replace(old, new))

          readme = Path("README.md")
          readme_anchor = (
              "A direct `if true` or `if false` refines control-flow reachability without\n"
              "turning the checker into a general constant folder. Only the selected branch may\n"
              "contribute definite-initialization, non-continuation, or loop-exit facts; the\n"
              "unselected branch is still lowered for deterministic static diagnostics and still\n"
              "participates in branch type compatibility. Block-valued or computed Boolean\n"
              "conditions keep the ordinary conservative two-branch merge.\n"
          )
          readme_extra = (
              "\nA `match` whose lowered scrutinee is itself a successfully typed direct enum\n"
              "constructor, such as `Result::Value(40)`, receives the same narrow reachability\n"
              "refinement. Only the arm for that constructed variant may contribute reachable\n"
              "definite-initialization, non-continuation, or loop-exit facts. Every arm remains\n"
              "subject to pattern, payload, exhaustiveness, duplicate-variant, name, and type\n"
              "checking, and all arm result types must still be compatible. Matches over locals,\n"
              "parameters, calls, blocks, or other computed enum values retain the ordinary\n"
              "conservative all-arm flow merge.\n"
          )
          replace_once(readme, readme_anchor, readme_anchor + readme_extra)

          constitution = Path("docs/language-constitution.md")
          constitution_anchor = (
              "A direct Boolean-literal `if` is another provisional reachability refinement.\n"
              "For `if true`, only the then branch contributes reachable flow facts; for\n"
              "`if false`, only the else branch does. The unselected branch remains fully\n"
              "subject to name and type diagnostics, including branch type compatibility, but\n"
              "its assignments, returns, and loop transfers cannot affect reachable continuation\n"
              "state. Computed and block-valued Boolean conditions keep the ordinary two-branch\n"
              "merge; this rule is not general constant folding.\n"
          )
          constitution_extra = (
              "\nA valid exhaustive `match` receives an equally narrow refinement only when its\n"
              "lowered scrutinee is a directly constructed, successfully typed enum variant.\n"
              "The arm for that variant is the sole source of reachable assignment,\n"
              "non-continuation, and loop-exit facts; every other arm is lowered for diagnostics\n"
              "without mutating reachable flow state. Pattern validity, payload bindings,\n"
              "duplicate detection, exhaustiveness, and arm type compatibility still consider\n"
              "the complete match. Any computed enum scrutinee keeps the conservative merge over\n"
              "all continuing arms; constructor recognition is not general value propagation.\n"
          )
          replace_once(
              constitution,
              constitution_anchor,
              constitution_anchor + constitution_extra,
          )

          roadmap = Path("docs/roadmap.md")
          replace_once(
              roadmap,
              "**Status: nine vertical slices implemented; broader type-system work remains.**",
              "**Status: ten vertical slices implemented; broader type-system work remains.**",
          )
          roadmap_anchor = (
              "- analyzer adversarial tests plus CLI check/run fixtures lock selected/dead\n"
              "  initialization and loop-control behavior end to end.\n\n"
              "The next Phase 2 slices should address semantic depth rather than widen syntax\n"
          )
          roadmap_replacement = (
              "- analyzer adversarial tests plus CLI check/run fixtures lock selected/dead\n"
              "  initialization and loop-control behavior end to end.\n\n"
              "Implemented in the tenth Phase 2 slice:\n\n"
              "- a successfully typed direct enum-constructor scrutinee exposes its resolved\n"
              "  variant slot to semantic match reachability without adding constant folding;\n"
              "- only the selected constructor arm contributes reachable definite-initialization,\n"
              "  non-continuation, and loop-exit facts;\n"
              "- unselected arms remain fully checked for pattern/payload validity, duplicate\n"
              "  variants, exhaustiveness, names, and arm type compatibility while their flow\n"
              "  mutations are discarded;\n"
              "- matches over parameters, locals, calls, blocks, and other computed enum values\n"
              "  retain the existing conservative merge across continuing arms;\n"
              "- payload-carrying direct constructors preserve the selected arm's immutable\n"
              "  payload binding while still refining outer flow state; and\n"
              "- analyzer adversarial tests plus CLI check/run fixtures lock initialization,\n"
              "  payload, return, loop-exit, dead-arm diagnostic, and dynamic-match behavior.\n\n"
              "The next Phase 2 slices should address semantic depth rather than widen syntax\n"
          )
          replace_once(roadmap, roadmap_anchor, roadmap_replacement)
          PY
      - name: Commit docs and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-direct-match-docs.yml
          git add README.md docs/language-constitution.md docs/roadmap.md
          git commit -m "docs: specify direct-match semantic reachability"
          git push origin HEAD:feat/direct-match-dataflow
