name: Static match usefulness

on:
  push:
    branches:
      - feat/static-match-arm-usefulness
    paths:
      - .github/static-match-usefulness.py
      - .github/workflows/static-match-usefulness.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/static-match-arm-usefulness
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply and validate static usefulness warning
        shell: bash
        run: |
          set -euo pipefail
          python .github/static-match-usefulness.py
          cargo fmt --all
          cargo test -p nova-sema --test static_match_arm_usefulness
          cargo test -p nova-sema
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git rm -f .github/static-match-usefulness.py .github/workflows/static-match-usefulness.yml
          git add crates/nova-sema/src/analyzer.rs crates/nova-sema/tests/static_match_arm_usefulness.rs
          git commit -m "feat: warn on statically unreachable match arms"
          git push origin HEAD:feat/static-match-arm-usefulness
