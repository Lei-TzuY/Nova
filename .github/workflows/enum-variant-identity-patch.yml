name: Enum variant identity patch

on:
  push:
    branches:
      - fix/enum-variant-identity
    paths:
      - .github/enum-variant-identity-patch.py
      - .github/enum-variant-identity-fix.py
      - .github/workflows/enum-variant-identity-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enum-variant-identity
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply and validate enum variant identity patch
        run: |
          python .github/enum-variant-identity-patch.py
          python .github/enum-variant-identity-fix.py
          cargo fmt --all
          cargo test -p nova-sema --test enum_variant_identity --locked
          cargo test -p nova-interpreter --test enum_variant_identity --locked
          cargo test -p nova-inspect --test enum_variant_identity --locked
          rm .github/enum-variant-identity-patch.py
          rm .github/enum-variant-identity-fix.py
          rm .github/workflows/enum-variant-identity-patch.yml
          rm .github/workflows/enum-variant-identity-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve resolved enum variant identity"
          git push origin HEAD:fix/enum-variant-identity
