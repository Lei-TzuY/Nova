name: CFG loop-header entry docs

on:
  push:
    branches:
      - fix/cfg-loop-header-entry
    paths:
      - .github/cfg_loop_header_docs.py
      - .github/workflows/cfg-loop-header-docs.yml

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cfg-loop-header-entry
          fetch-depth: 0
      - name: Apply loop-header entry docs
        shell: bash
        run: |
          set -euo pipefail
          python .github/cfg_loop_header_docs.py
          rm .github/cfg_loop_header_docs.py .github/workflows/cfg-loop-header-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: close CFG loop-header entry slice'
          git push origin HEAD:fix/cfg-loop-header-entry
