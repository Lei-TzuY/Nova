name: Patch invalid aggregate flow

on:
  push:
    branches:
      - fix/invalid-aggregate-flow

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/invalid-aggregate-flow
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Confirm regression coverage fails before fix
        shell: bash
        run: |
          set +e
          cargo test -p nova-sema --test invalid_aggregate_flow --locked
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "invalid aggregate flow regressions unexpectedly already pass"
            exit 1
          fi
      - name: Fix invalid aggregate flow recovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/nova-sema/src/analyzer.rs")
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old!r}")
              text = text.replace(old, new)

          replace_once(
              "        let definition = self.record_definitions[record_id.index()].clone();\n        let mut seen = BTreeMap::<String, Span>::new();",
              "        let definition = self.record_definitions[record_id.index()].clone();\n        let aggregate_entry_state = self.capture_reachable_state();\n        let mut seen = BTreeMap::<String, Span>::new();",
          )
          replace_once(
              "        let mut contains_error = false;\n        let mut contains_never = false;\n        let mut can_continue = true;",
              "        let mut contains_error = false;\n        let mut contains_never = false;\n        let mut type_error = false;\n        let mut can_continue = true;",
          )
          replace_once(
              "            let expected = &definition.fields[field_index].ty;\n            self.require_type(&value.ty, expected, value.span, \"record field initializer\");\n            resolved.push(RecordFieldValue { field_index, value });",
              "            let expected = &definition.fields[field_index].ty;\n            let type_matches = types_compatible(&value.ty, expected);\n            self.require_type(&value.ty, expected, value.span, \"record field initializer\");\n            type_error |= !type_matches;\n            resolved.push(RecordFieldValue { field_index, value });",
          )
          replace_once(
              "        } else if structural_error || contains_error {\n            Type::Error",
              "        } else if structural_error || contains_error || type_error {\n            Type::Error",
          )
          replace_once(
              "        if structural_error {\n            (ExpressionKind::Error, ty)\n        } else {\n            (\n                ExpressionKind::RecordLiteral {\n                    record: record_id,\n                    fields: resolved,\n                },\n                ty,\n            )\n        }\n    }\n\n    fn lower_enum_constructor(",
              "        let should_restore = ty.is_error();\n        let result = if structural_error {\n            (ExpressionKind::Error, ty)\n        } else {\n            (\n                ExpressionKind::RecordLiteral {\n                    record: record_id,\n                    fields: resolved,\n                },\n                ty,\n            )\n        };\n        if should_restore {\n            self.restore_reachable_state(aggregate_entry_state);\n        }\n        result\n    }\n\n    fn lower_enum_constructor(",
          )

          replace_once(
              "    ) -> (ExpressionKind, Type) {\n        let payload =\n            payload.map(|expression| Box::new(self.lower_expression(expression, return_type)));",
              "    ) -> (ExpressionKind, Type) {\n        let aggregate_entry_state = self.capture_reachable_state();\n        let payload =\n            payload.map(|expression| Box::new(self.lower_expression(expression, return_type)));",
          )

          early_return = (
              "            return (\n"
              "                ExpressionKind::Error,\n"
              "                if payload_never {\n"
              "                    Type::Never\n"
              "                } else {\n"
              "                    Type::Error\n"
              "                },\n"
              "            );"
          )
          early_replacement = (
              "            let ty = if payload_never {\n"
              "                Type::Never\n"
              "            } else {\n"
              "                self.restore_reachable_state(aggregate_entry_state);\n"
              "                Type::Error\n"
              "            };\n"
              "            return (ExpressionKind::Error, ty);"
          )
          count = text.count(early_return)
          if count != 3:
              raise SystemExit(f"expected three enum early returns, found {count}")
          text = text.replace(early_return, early_replacement)

          replace_once(
              "        let declared = &definition.variants[variant_index];\n        let arity_matches = match (&declared.payload, payload.as_deref()) {",
              "        let declared = &definition.variants[variant_index];\n        let mut payload_type_error = false;\n        let arity_matches = match (&declared.payload, payload.as_deref()) {",
          )
          replace_once(
              "            (Some(expected), Some(actual)) => {\n                self.require_type(&actual.ty, expected, actual.span, \"enum variant payload\");\n                true\n            }",
              "            (Some(expected), Some(actual)) => {\n                let type_matches = types_compatible(&actual.ty, expected);\n                self.require_type(&actual.ty, expected, actual.span, \"enum variant payload\");\n                payload_type_error = !type_matches;\n                true\n            }",
          )
          replace_once(
              "        } else if payload_error || !arity_matches {\n            Type::Error",
              "        } else if payload_error || payload_type_error || !arity_matches {\n            Type::Error",
          )
          replace_once(
              "        if arity_matches {\n            (\n                ExpressionKind::EnumConstructor {\n                    enumeration: enum_id,\n                    variant_index,\n                    payload,\n                },\n                ty,\n            )\n        } else {\n            (ExpressionKind::Error, ty)\n        }\n    }\n\n    fn lower_match(",
              "        let should_restore = ty.is_error();\n        let result = if arity_matches {\n            (\n                ExpressionKind::EnumConstructor {\n                    enumeration: enum_id,\n                    variant_index,\n                    payload,\n                },\n                ty,\n            )\n        } else {\n            (ExpressionKind::Error, ty)\n        };\n        if should_restore {\n            self.restore_reachable_state(aggregate_entry_state);\n        }\n        result\n    }\n\n    fn lower_match(",
          )

          path.write_text(text)

          constitution = Path("docs/language-constitution.md")
          constitution_text = constitution.read_text()
          constitution_anchor = (
              "initialization facts during diagnostic recovery. This is direct-constructor\n"
              "reachability, not propagation of enum values through locals, calls, or general\n"
              "constant evaluation.\n"
          )
          constitution_extra = (
              "\nContinuing record or enum construction that is itself rejected by structural or\n"
              "payload/field type validation is fail-closed for flow recovery: assignments and\n"
              "loop-exit facts produced only while lowering that invalid aggregate cannot establish\n"
              "state after the rejected expression. If a child expression is already `!`, its\n"
              "reachable non-continuation remains dominant; this rollback rule applies only when\n"
              "the invalid aggregate would otherwise continue.\n"
          )
          count = constitution_text.count(constitution_anchor)
          if count != 1:
              raise SystemExit(f"constitution anchor count: {count}")
          constitution.write_text(
              constitution_text.replace(
                  constitution_anchor,
                  constitution_anchor + constitution_extra,
              )
          )

          readme = Path("README.md")
          readme_text = readme.read_text()
          readme_anchor = (
              "`value.field` is read-only field projection in this slice. Record equality,\n"
              "field assignment, layout, and ABI guarantees are not implemented.\n"
          )
          readme_extra = (
              "\nRejected aggregate construction is fail-closed for continuing flow recovery. A\n"
              "record with invalid field shape/type or an enum constructor with invalid payload\n"
              "shape/type may still emit deterministic child diagnostics, but assignments or loop\n"
              "exits created only inside that rejected continuing expression do not become\n"
              "post-expression facts. A child that is already non-continuing keeps its `!` flow.\n"
          )
          count = readme_text.count(readme_anchor)
          if count != 1:
              raise SystemExit(f"README anchor count: {count}")
          readme.write_text(readme_text.replace(readme_anchor, readme_anchor + readme_extra))

          roadmap = Path("docs/roadmap.md")
          roadmap_text = roadmap.read_text()
          old_status = "**Status: eleven vertical slices implemented; broader type-system work remains.**"
          new_status = "**Status: twelve vertical slices implemented; broader type-system work remains.**"
          if roadmap_text.count(old_status) != 1:
              raise SystemExit("roadmap status anchor mismatch")
          roadmap_text = roadmap_text.replace(old_status, new_status)
          roadmap_anchor = (
              "- dedicated regression tests plus the existing adversarial semantic suite lock the\n"
              "  refactor to behavior-preserving state restoration.\n\n"
              "The next Phase 2 slices should address semantic depth rather than widen syntax\n"
          )
          roadmap_replacement = (
              "- dedicated regression tests plus the existing adversarial semantic suite lock the\n"
              "  refactor to behavior-preserving state restoration.\n\n"
              "Implemented in the twelfth Phase 2 slice:\n\n"
              "- continuing record construction that fails structural, child-error, or field-type\n"
              "  validation restores its pre-construction reachable state instead of exporting\n"
              "  assignments or loop-exit facts from rejected source;\n"
              "- enum constructors apply the same rollback to unknown/invalid constructors, payload\n"
              "  arity errors, child errors, and payload type mismatches;\n"
              "- aggregate field/payload type mismatches now produce `Type::Error` HIR rather than\n"
              "  retaining a nominal aggregate type after diagnostic `N3004`;\n"
              "- a child expression that is already non-continuing still yields `!`, preserving\n"
              "  reachable return/break/continue precedence over continuing recovery rollback; and\n"
              "- adversarial tests lock both definite-initialization rollback and non-continuing\n"
              "  aggregate inputs across records and enums.\n\n"
              "The next Phase 2 slices should address semantic depth rather than widen syntax\n"
          )
          if roadmap_text.count(roadmap_anchor) != 1:
              raise SystemExit("roadmap insertion anchor mismatch")
          roadmap.write_text(roadmap_text.replace(roadmap_anchor, roadmap_replacement))
          PY
          cargo fmt --all
      - name: Validate aggregate recovery fix
        run: cargo test -p nova-sema --all-targets --locked
      - name: Commit fix and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-invalid-aggregate-flow.yml
          git add crates/nova-sema/src/analyzer.rs crates/nova-sema/tests/invalid_aggregate_flow.rs README.md docs/language-constitution.md docs/roadmap.md
          git commit -m "fix: fail closed on invalid aggregate flow"
          git push origin HEAD:fix/invalid-aggregate-flow
