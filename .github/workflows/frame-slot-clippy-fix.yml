name: Frame slot clippy fix

on:
  push:
    branches:
      - fix/runtime-frame-slot-integrity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-frame-slot-integrity
          fetch-depth: 0
      - name: Apply Clippy fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/nova-interpreter/src/lib.rs')
          text = path.read_text()
          old = '                if &expression.ty != &slot.ty {'
          new = '                if expression.ty != slot.ty {'
          if old not in text:
              raise SystemExit('Clippy anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/frame-slot-clippy-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/nova-interpreter/src/lib.rs .github/workflows/frame-slot-clippy-fix.yml
          git commit -m 'style: satisfy frame slot Clippy'
          git push origin HEAD:fix/runtime-frame-slot-integrity
