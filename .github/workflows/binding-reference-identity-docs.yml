name: Binding reference identity docs

on:
  push:
    branches:
      - fix/binding-reference-identity
    paths:
      - .github/binding-reference-identity-docs.py
      - .github/workflows/binding-reference-identity-docs.yml

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/binding-reference-identity
      - name: Apply binding reference identity docs
        run: |
          python .github/binding-reference-identity-docs.py
          rm .github/binding-reference-identity-docs.py
          rm .github/workflows/binding-reference-identity-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close binding reference identity slice"
          git push origin HEAD:fix/binding-reference-identity
