name: Validate invalid while continue flow

on:
  push:
    branches:
      - fix/invalid-while-continue-backedge

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile regression target
        run: cargo test -p nova-sema --test invalid_while_continue_flow --no-run --locked
      - name: Confirm recovery backedge regression is red
        shell: bash
        run: |
          set +e
          cargo test -p nova-sema --test invalid_while_continue_flow --locked > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo "expected invalid-while continue regression to fail before the fix"
            exit 1
          fi
      - name: Apply narrow recovery-backedge fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/nova-sema/src/analyzer.rs")
          text = path.read_text()
          old = '''                for continue_cursor in &loop_context.continue_cursors {
                    self.flow
                        .as_mut()
                        .expect("semantic lowering must own a function flow graph")
                        .add_backedge(*continue_cursor, loop_context.header);
                }
'''
          new = '''                if condition.ty == Type::Bool && !guaranteed_skip {
                    for continue_cursor in &loop_context.continue_cursors {
                        self.flow
                            .as_mut()
                            .expect("semantic lowering must own a function flow graph")
                            .add_backedge(*continue_cursor, loop_context.header);
                    }
                }
'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one continue-backedge loop")
          path.write_text(text.replace(old, new))
      - name: Format
        run: cargo fmt --all
      - name: Validate behavior
        run: |
          cargo test -p nova-sema --test invalid_while_continue_flow --locked
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo build --workspace --all-targets --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - name: Commit implementation and remove helper
        shell: bash
        run: |
          rm .github/workflows/invalid-while-continue-flow.yml
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add crates/nova-sema/src/analyzer.rs .github/workflows/invalid-while-continue-flow.yml
          git commit -m "fix: isolate invalid while continue recovery flow"
          git push
