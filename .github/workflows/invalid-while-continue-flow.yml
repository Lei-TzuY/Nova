name: Validate invalid while continue flow

on:
  push:
    branches: [fix/invalid-while-continue-backedge]

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Compile regression target
        run: cargo test -p nova-sema --test invalid_while_continue_flow --locked --no-run

      - name: Confirm recovery backedge regression is red
        shell: bash
        run: |
          set -euo pipefail
          if cargo test -p nova-sema --test invalid_while_continue_flow --locked; then
            echo "expected invalid-while continue regression to fail before the fix" >&2
            exit 1
          fi

      - name: Apply recovery-backedge fix
        run: python scripts/apply-invalid-while-continue-flow.py

      - name: Validate behavior
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test -p nova-sema --test invalid_while_continue_flow --locked
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo build --workspace --all-targets --locked
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked

      - name: Commit implementation and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/invalid-while-continue-flow.yml
          rm scripts/apply-invalid-while-continue-flow.py
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add -A
          git commit -m 'fix: isolate invalid while continue recovery flow'
          git push origin HEAD:fix/invalid-while-continue-backedge
