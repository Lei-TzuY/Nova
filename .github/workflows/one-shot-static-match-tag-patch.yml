name: One-shot static match tag patch

on:
  push:
    branches: [feat/static-match-dynamic-payload-tags]
    paths:
      - .github/workflows/one-shot-static-match-tag-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/static-match-dynamic-payload-tags
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Split static variant tags from closed values and self-delete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          condition = Path("crates/nova-sema/src/constant_condition.rs")
          text = condition.read_text()
          old = """pub(crate) fn closed_match_variant(expression: &Expression) -> Option<(EnumId, usize)> {
              let (enumeration, variant_index, _, _) = match_variant_with_bindings(expression, &[])?;
              Some((enumeration, variant_index))
          }

          """
          new = """pub(crate) fn static_match_variant(expression: &Expression) -> Option<(EnumId, usize)> {
              match_variant_tag_with_bindings(expression, &[])
          }

          fn match_variant_tag_with_bindings<'a>(
              expression: &'a Expression,
              bindings: &[ClosedBinding<'a>],
          ) -> Option<(EnumId, usize)> {
              match &expression.kind {
                  ExpressionKind::EnumConstructor {
                      enumeration,
                      variant_index,
                      ..
                  } => Some((*enumeration, *variant_index)),
                  ExpressionKind::Binding(reference) => match_variant_tag_with_bindings(
                      closed_binding_value(reference, &expression.ty, bindings)?,
                      bindings,
                  ),
                  ExpressionKind::If {
                      condition,
                      then_branch,
                      else_branch,
                  } => match evaluate_with_bindings(condition, bindings)? {
                      true => {
                          let (tail, selected_bindings) =
                              closed_block_tail_with_bindings(then_branch, bindings)?.ok()?;
                          match_variant_tag_with_bindings(tail?, &selected_bindings)
                      }
                      false => match_variant_tag_with_bindings(else_branch, bindings),
                  },
                  ExpressionKind::Match {
                      scrutinee,
                      enumeration,
                      arms,
                  } => {
                      let (value, selected_bindings) = selected_match_value_with_bindings(
                          scrutinee,
                          *enumeration,
                          arms,
                          bindings,
                      )?;
                      match_variant_tag_with_bindings(value, &selected_bindings)
                  }
                  ExpressionKind::FieldAccess {
                      base,
                      record,
                      field_index,
                      ..
                  } => {
                      let (value, selected_bindings) =
                          selected_record_field_value_with_bindings(
                              base,
                              *record,
                              *field_index,
                              bindings,
                          )?;
                      match_variant_tag_with_bindings(value, &selected_bindings)
                  }
                  ExpressionKind::Block(block) => {
                      let (tail, selected_bindings) =
                          closed_block_tail_with_bindings(block, bindings)?.ok()?;
                      match_variant_tag_with_bindings(tail?, &selected_bindings)
                  }
                  _ => None,
              }
          }

          """
          assert text.count(old) == 1, "static variant public anchor drifted"
          condition.write_text(text.replace(old, new, 1))

          analyzer = Path("crates/nova-sema/src/analyzer.rs")
          analyzer_text = analyzer.read_text()
          old_call = "crate::constant_condition::closed_match_variant(&scrutinee)"
          new_call = "crate::constant_condition::static_match_variant(&scrutinee)"
          assert analyzer_text.count(old_call) == 1, "analyzer static variant call anchor drifted"
          analyzer.write_text(analyzer_text.replace(old_call, new_call, 1))
          PY

          cargo fmt --all
          rm .github/workflows/one-shot-static-match-tag-patch.yml
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add crates/nova-sema/src/constant_condition.rs crates/nova-sema/src/analyzer.rs crates/nova-sema/tests/static_match_dynamic_payload_usefulness.rs .github/workflows/one-shot-static-match-tag-patch.yml
          git diff --cached --check
          git commit -m "feat: separate static match tags from closed payloads"
          git push origin HEAD:feat/static-match-dynamic-payload-tags
