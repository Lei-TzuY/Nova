name: Function equality docfix

on:
  push:
    branches:
      - feat/function-identity-equality

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/function-identity-equality
      - name: Align closed-proof documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/nova-sema/src/constant_condition.rs')
          text = path.read_text()
          old = '''/// Evaluates only side-effect-free, closed bootstrap conditions whose value is
          /// already determined by literal Bool/Int operations. The HIR is never folded.
          '''
          new = '''/// Evaluates only side-effect-free, closed bootstrap conditions whose value is
          /// already determined by supported literal, identity, comparison, and Boolean proofs.
          /// The HIR is never folded.
          '''
          if old not in text:
              raise SystemExit('closed-proof doc anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          rm .github/workflows/function-equality-docfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: align closed proof contract"
          git push origin HEAD:feat/function-identity-equality
