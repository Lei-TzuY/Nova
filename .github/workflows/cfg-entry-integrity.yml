name: Validate CFG entry integrity

on:
  push:
    branches:
      - fix/cfg-entry-integrity

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Add root-integrity regressions
        run: python .github/scripts/validate_cfg_entry_integrity.py tests

      - name: Compile regression target first
        run: cargo test -p nova-sema --lib --no-run --locked

      - name: Confirm CFG root invariant is red
        shell: bash
        run: |
          set +e
          cargo test -p nova-sema verifier_rejects_root_kind_mismatch_and_duplicate_entry --locked
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected the pre-fix root-integrity regression to fail"
            exit 1
          fi

      - name: Apply CFG root-integrity fix
        run: python .github/scripts/validate_cfg_entry_integrity.py fix

      - name: Format and validate behavior
        shell: bash
        run: |
          cargo fmt --all
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo build --workspace --all-targets --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

      - name: Assert root-integrity structure
        shell: bash
        run: |
          grep -q 'flow entry does not reference the unique Entry node' crates/nova-sema/src/control_flow.rs
          grep -q 'verifier_rejects_root_kind_mismatch_and_duplicate_entry' crates/nova-sema/src/control_flow.rs
          grep -q 'thirty-four vertical slices implemented' docs/roadmap.md

      - name: Commit implementation and remove helpers
        shell: bash
        run: |
          rm .github/workflows/cfg-entry-integrity.yml
          rm .github/scripts/validate_cfg_entry_integrity.py
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "fix: verify CFG root identity integrity"
          git push origin HEAD:fix/cfg-entry-integrity
