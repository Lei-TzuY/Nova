name: Runtime frame slot patch

on:
  push:
    branches:
      - fix/runtime-frame-slot-integrity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-frame-slot-integrity
          fetch-depth: 0
      - name: Apply focused patch
        run: python .github/runtime-frame-slot-patch.py
      - name: Format and commit
        shell: bash
        run: |
          cargo fmt --all
          rm .github/runtime-frame-slot-patch.py
          rm .github/workflows/runtime-frame-slot-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/nova-interpreter/src/lib.rs crates/nova-interpreter/tests/frame_slot_integrity.rs README.md docs/roadmap.md .github/runtime-frame-slot-patch.py .github/workflows/runtime-frame-slot-patch.yml
          git commit -m 'fix: validate runtime frame slots'
          git push origin HEAD:fix/runtime-frame-slot-integrity
