name: PR166 expression depth fixer

on:
  push:
    branches:
      - feat/closures-lexical-capture

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/closures-lexical-capture
      - name: Tighten bootstrap expression recursion guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/nova-parser/src/parser.rs')
          text = p.read_text()
          old = 'const MAX_EXPRESSION_DEPTH: usize = 256;'
          new = 'const MAX_EXPRESSION_DEPTH: usize = 128;'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one expression-depth constant')
          p.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/fix-pr166-expression-depth.yml
          git diff --check
      - name: Commit recursion guard repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(parser): keep expression depth below host stack limit"
          git push origin HEAD:feat/closures-lexical-capture
