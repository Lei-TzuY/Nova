name: Validate CFG-only initialization

on:
  push:
    branches: [refactor/cfg-only-initialization]

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Compile architectural regression target
        run: cargo test -p nova-sema --test cfg_only_initialization --locked --no-run

      - name: Confirm legacy inline initialization is red
        shell: bash
        run: |
          set -euo pipefail
          if cargo test -p nova-sema --test cfg_only_initialization --locked; then
            echo "expected cfg-only initialization regressions to fail before the refactor" >&2
            exit 1
          fi

      - name: Apply CFG-only initialization refactor
        run: python scripts/apply-cfg-only-initialization.py

      - name: Format and assert single-source structure
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          test ! -e crates/nova-sema/src/flow_rules.rs
          ! grep -n 'initialized: bool' crates/nova-sema/src/analyzer.rs
          ! grep -n '\.initialized' crates/nova-sema/src/analyzer.rs
          ! grep -R 'InitializationJoin' crates/nova-sema/src --include='*.rs'
          ! grep -R 'mark_initialized' crates/nova-sema/src --include='*.rs'
          test "$(grep -R 'Diagnostic::error("N3009"' crates/nova-sema/src --include='*.rs' | wc -l)" -eq 1

      - name: Validate behavior
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p nova-sema --test cfg_only_initialization --locked
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo build --workspace --all-targets --locked
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked

      - name: Commit implementation and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/cfg-only-initialization.yml
          rm scripts/apply-cfg-only-initialization.py
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: make CFG initialization the single source of truth'
          git push origin HEAD:refactor/cfg-only-initialization
