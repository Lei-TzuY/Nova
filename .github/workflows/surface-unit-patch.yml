name: Apply surface Unit implementation

on:
  push:
    branches:
      - feat/surface-unit

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/surface-unit
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch parser, HIR, sema, and interpreter
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def block(lines):
              return "\n".join(lines) + "\n"

          def patch(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          patch(
              "crates/nova-parser/src/ast.rs",
              block([
                  "    /// Boolean value.",
                  "    Boolean(bool),",
                  "    /// Unresolved name reference.",
              ]),
              block([
                  "    /// Boolean value.",
                  "    Boolean(bool),",
                  "    /// Unit value written as `()`.",
                  "    Unit,",
                  "    /// Unresolved name reference.",
              ]),
          )

          patch(
              "crates/nova-parser/src/parser.rs",
              block([
                  "            TokenKind::LeftParen => {",
                  "                let opening = self.bump();",
                  "                let mut expression = self.parse_expression_with_binding_power(0)?;",
                  "                let closing = self.expect(TokenKind::RightParen, \"to close the expression\")?;",
                  "                expression.span = self.cover(opening.span, closing.span);",
                  "                Some(expression)",
                  "            }",
              ]),
              block([
                  "            TokenKind::LeftParen => {",
                  "                let opening = self.bump();",
                  "                if let Some(closing) = self.consume(TokenKind::RightParen) {",
                  "                    return Some(Expression {",
                  "                        kind: ExpressionKind::Unit,",
                  "                        span: self.cover(opening.span, closing.span),",
                  "                    });",
                  "                }",
                  "                let mut expression = self.parse_expression_with_binding_power(0)?;",
                  "                let closing = self.expect(TokenKind::RightParen, \"to close the expression\")?;",
                  "                expression.span = self.cover(opening.span, closing.span);",
                  "                Some(expression)",
                  "            }",
              ]),
          )

          parser_marker = block([
              "    #[test]",
              "    fn parses_typed_uninitialized_var() {",
          ])
          parser_test = block([
              "    #[test]",
              "    fn parses_surface_unit_type_and_literal() {",
              "        let (_, parsed) = parse_text(\"fn noop() -> Unit { () } fn empty() -> Unit {}\");",
              "        assert!(parsed.is_success(), \"{:?}\", parsed.diagnostics);",
              "        assert_eq!(parsed.program.functions[0].return_type.name.text, \"Unit\");",
              "        assert!(matches!(",
              "            parsed.program.functions[0]",
              "                .body",
              "                .tail",
              "                .as_deref()",
              "                .map(|expression| &expression.kind),",
              "            Some(ExpressionKind::Unit)",
              "        ));",
              "        assert!(parsed.program.functions[1].body.tail.is_none());",
              "    }",
              "",
          ])
          patch("crates/nova-parser/src/parser.rs", parser_marker, parser_test + parser_marker)

          patch(
              "crates/nova-sema/src/hir.rs",
              block([
                  "    /// Internal type of a value-less block. There is no surface `Unit` type yet.",
                  "    Unit,",
              ]),
              block([
                  "    /// Unit type, produced by `()` and value-less blocks.",
                  "    Unit,",
              ]),
          )
          patch(
              "crates/nova-sema/src/hir.rs",
              "            Self::Unit => formatter.write_str(\"()\"),\n",
              "            Self::Unit => formatter.write_str(\"Unit\"),\n",
          )
          patch(
              "crates/nova-sema/src/hir.rs",
              block([
                  "    /// Boolean literal.",
                  "    Boolean(bool),",
                  "    /// Reference to a local binding or parameter.",
              ]),
              block([
                  "    /// Boolean literal.",
                  "    Boolean(bool),",
                  "    /// Unit literal.",
                  "    Unit,",
                  "    /// Reference to a local binding or parameter.",
              ]),
          )

          patch(
              "crates/nova-sema/src/analyzer.rs",
              "            if matches!(name.text.as_str(), \"Int\" | \"Bool\") {\n",
              "            if matches!(name.text.as_str(), \"Int\" | \"Bool\" | \"Unit\") {\n",
          )
          patch(
              "crates/nova-sema/src/analyzer.rs",
              block([
                  "            \"Int\" => Type::Int,",
                  "            \"Bool\" => Type::Bool,",
                  "            unknown => {",
              ]),
              block([
                  "            \"Int\" => Type::Int,",
                  "            \"Bool\" => Type::Bool,",
                  "            \"Unit\" => Type::Unit,",
                  "            unknown => {",
              ]),
          )
          patch(
              "crates/nova-sema/src/analyzer.rs",
              "                            \"the bootstrap semantic core recognizes Int, Bool, and declared record or enum names\",\n",
              "                            \"the bootstrap semantic core recognizes Int, Bool, Unit, and declared record or enum names\",\n",
          )
          patch(
              "crates/nova-sema/src/analyzer.rs",
              "        if !body.ty.is_never() && function.body.tail.is_none() {\n",
              "        if !body.ty.is_never()\n            && function.body.tail.is_none()\n            && signature.return_type != Type::Unit\n        {\n",
          )
          patch(
              "crates/nova-sema/src/analyzer.rs",
              block([
                  "            ast::ExpressionKind::Integer(value) => (ExpressionKind::Integer(*value), Type::Int),",
                  "            ast::ExpressionKind::Boolean(value) => (ExpressionKind::Boolean(*value), Type::Bool),",
                  "            ast::ExpressionKind::Name(name) => self.lower_name(name),",
              ]),
              block([
                  "            ast::ExpressionKind::Integer(value) => (ExpressionKind::Integer(*value), Type::Int),",
                  "            ast::ExpressionKind::Boolean(value) => (ExpressionKind::Boolean(*value), Type::Bool),",
                  "            ast::ExpressionKind::Unit => (ExpressionKind::Unit, Type::Unit),",
                  "            ast::ExpressionKind::Name(name) => self.lower_name(name),",
              ]),
          )

          sema_marker = block([
              "    #[test]",
              "    fn resolves_records_construction_projection_and_signatures() {",
          ])
          sema_test = block([
              "    #[test]",
              "    fn supports_surface_unit_literals_types_and_fallthrough() {",
              "        let output = analyze_text(",
              "            \"fn empty() -> Unit {} fn explicit() -> Unit { () } fn returned() -> Unit { return (); }\",",
              "        );",
              "        assert!(output.is_success(), \"{:?}\", output.diagnostics);",
              "        assert_eq!(output.program.functions[0].return_type, Type::Unit);",
              "        assert_eq!(output.program.functions[0].body.ty, Type::Unit);",
              "        let tail = output.program.functions[1].body.tail.as_deref().expect(\"unit tail\");",
              "        assert!(matches!(tail.kind, ExpressionKind::Unit));",
              "        assert_eq!(tail.ty, Type::Unit);",
              "    }",
              "",
              "    #[test]",
              "    fn rejects_non_unit_values_and_reserved_unit_redefinition() {",
              "        let output = analyze_text(",
              "            \"record Unit { value: Int } fn bad_tail() -> Unit { 1 } fn bad_return() -> Unit { return 1; }\",",
              "        );",
              "        assert_eq!(codes(&output), vec![\"N3002\", \"N3004\", \"N3004\"]);",
              "    }",
              "",
          ])
          patch("crates/nova-sema/src/analyzer.rs", sema_marker, sema_test + sema_marker)

          patch(
              "crates/nova-interpreter/src/lib.rs",
              "    /// Internal value for a block with no tail expression.\n    Unit,\n",
              "    /// Unit value produced by `()` or a value-less block.\n    Unit,\n",
          )
          patch(
              "crates/nova-interpreter/src/lib.rs",
              block([
                  "            ExpressionKind::Integer(value) => Ok(Flow::Value(Value::Int(*value))),",
                  "            ExpressionKind::Boolean(value) => Ok(Flow::Value(Value::Bool(*value))),",
                  "            ExpressionKind::Binding(binding) => {",
              ]),
              block([
                  "            ExpressionKind::Integer(value) => Ok(Flow::Value(Value::Int(*value))),",
                  "            ExpressionKind::Boolean(value) => Ok(Flow::Value(Value::Bool(*value))),",
                  "            ExpressionKind::Unit => Ok(Flow::Value(Value::Unit)),",
                  "            ExpressionKind::Binding(binding) => {",
              ]),
          )
          PY
          cargo fmt --all
          cargo test -p nova-parser -p nova-sema -p nova-interpreter --lib --locked
      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/surface-unit-patch.yml
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "feat: add surface Unit semantics"
          git push origin HEAD:feat/surface-unit
