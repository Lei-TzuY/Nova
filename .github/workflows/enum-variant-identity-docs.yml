name: Enum variant identity docs

on:
  push:
    branches:
      - fix/enum-variant-identity
    paths:
      - .github/enum-variant-identity-docs.py
      - .github/workflows/enum-variant-identity-docs.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enum-variant-identity
      - uses: dtolnay/rust-toolchain@stable
      - name: Finalize enum variant identity slice
        run: |
          python .github/enum-variant-identity-docs.py
          cargo fmt --all -- --check
          cargo test -p nova-sema --test enum_variant_identity --locked
          cargo test -p nova-interpreter --test enum_variant_identity --locked
          cargo test -p nova-inspect --test enum_variant_identity --locked
          rm .github/enum-variant-identity-docs.py
          rm .github/workflows/enum-variant-identity-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close resolved enum variant identity slice"
          git push origin HEAD:fix/enum-variant-identity
