name: Validate CFG binding-table integrity

on:
  push:
    branches:
      - fix/cfg-binding-table-integrity

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Add corruption regressions
        run: python .github/scripts/validate_cfg_binding_table.py tests

      - name: Compile regression target first
        run: cargo test -p nova-sema --lib --no-run --locked

      - name: Confirm canonical binding-table invariant is red
        shell: bash
        run: |
          set +e
          cargo test -p nova-sema verifier_rejects_duplicate_and_out_of_order_binding_metadata --locked
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected the pre-fix verifier regression to fail"
            exit 1
          fi

      - name: Apply binding-table verifier fix
        run: python .github/scripts/validate_cfg_binding_table.py fix

      - name: Format and validate behavior
        shell: bash
        run: |
          cargo fmt --all
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo build --workspace --all-targets --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

      - name: Assert canonical structure
        shell: bash
        run: |
          grep -q 'flow binding metadata is not in strict semantic identity order' crates/nova-sema/src/control_flow.rs
          grep -q 'verifier_rejects_duplicate_and_out_of_order_binding_metadata' crates/nova-sema/src/control_flow.rs
          grep -q 'thirty-three vertical slices implemented' docs/roadmap.md

      - name: Commit implementation and remove helpers
        shell: bash
        run: |
          rm .github/workflows/cfg-binding-table-integrity.yml
          rm .github/scripts/validate_cfg_binding_table.py
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "fix: verify CFG binding metadata integrity"
          git push origin HEAD:fix/cfg-binding-table-integrity
