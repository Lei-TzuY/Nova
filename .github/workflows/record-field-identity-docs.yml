name: Record field identity docs

on:
  push:
    branches:
      - fix/record-field-identity

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/record-field-identity
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Finalize record field identity slice
        shell: bash
        run: |
          set -euo pipefail
          python .github/record_field_identity_docs.py
          cargo fmt --all
          cargo test -p nova-sema --test record_field_identity --locked
          cargo test -p nova-interpreter --test record_field_identity --locked
          cargo test -p nova-inspect rejects_same_typed_record_member_identity_drift --locked
          git rm .github/record_field_identity_docs.py .github/workflows/record-field-identity-docs.yml
          git add README.md docs/roadmap.md crates/nova-sema/tests/record_field_identity.rs crates/nova-sema/src/hir.rs crates/nova-sema/src/analyzer.rs crates/nova-interpreter/src/lib.rs crates/nova-interpreter/tests/record_field_identity.rs crates/nova-inspect/src/lib.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: close resolved record field identity slice"
          git push origin HEAD:fix/record-field-identity
