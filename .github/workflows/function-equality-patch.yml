name: Function equality patch

on:
  push:
    branches:
      - feat/function-identity-equality

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/function-identity-equality
      - name: Apply focused patch
        run: python .github/function_equality_patch.py
      - name: Format and commit
        run: |
          cargo fmt --all
          rm .github/function_equality_patch.py
          rm .github/workflows/function-equality-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add function identity equality"
          git push origin HEAD:feat/function-identity-equality
