name: Equality noncontinuation fix

on:
  push:
    branches:
      - fix/runtime-equality-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-equality-contract
      - uses: dtolnay/rust-toolchain@stable
      - name: Preserve equality noncontinuation flow
        run: |
          python .github/equality-flow-fix.py
          cargo fmt --all
          cargo test -p nova-interpreter --test equality_integrity --locked
          rm .github/equality-flow-fix.py
          rm .github/workflows/equality-flow-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve equality noncontinuation flow"
          git push origin HEAD:fix/runtime-equality-contract
