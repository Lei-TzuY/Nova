name: Finalize CFG normal exit integrity

on:
  push:
    branches: [fix/cfg-normal-exit-integrity]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Synchronize normal-exit contract and roadmap
        run: python scripts/finalize-cfg-normal-exit-integrity.py

      - name: Validate focused exit regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test -p nova-sema verifier_rejects_diagnostic_only_normal_exit --locked
          cargo test -p nova-sema verifier_rejects_unlisted_exit_node --locked
          cargo test -p nova-sema verifier_rejects_successor_after_exit --locked

      - name: Commit final slice and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-cfg-normal-exit-integrity.yml
          rm scripts/finalize-cfg-normal-exit-integrity.py
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add -A
          git commit -m 'docs: specify CFG normal exit integrity'
          git push origin HEAD:fix/cfg-normal-exit-integrity
