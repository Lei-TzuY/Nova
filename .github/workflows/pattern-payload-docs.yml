name: Pattern payload docs

on:
  push:
    branches:
      - feat/pattern-payload-discard
    paths:
      - .github/pattern-payload-docs.py
      - .github/workflows/pattern-payload-docs.yml

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pattern-payload-discard
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply docs and validate final tree
        shell: bash
        run: |
          set -euo pipefail
          python .github/pattern-payload-docs.py
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          grep -q 'payload_pattern     = identifier | "_"' docs/grammar.md
          grep -q 'schema-version 3' docs/semantic-introspection-v3.md
          grep -q 'fifty-one vertical slices' docs/roadmap.md
          grep -q 'twenty-two vertical slices' docs/roadmap.md
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git rm -f .github/pattern-payload-docs.py .github/workflows/pattern-payload-docs.yml
          git add README.md docs/grammar.md docs/enums-and-patterns.md docs/language-constitution.md \
            docs/semantic-introspection.md docs/semantic-introspection-v2.md \
            docs/semantic-introspection-v3.md docs/roadmap.md
          git commit -m "docs: specify payload discard and inspection v3"
          git push origin HEAD:feat/pattern-payload-discard
