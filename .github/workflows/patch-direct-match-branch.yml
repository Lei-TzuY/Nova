name: Patch direct-match branch

on:
  push:
    branches:
      - feat/direct-match-dataflow

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/direct-match-dataflow
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch direct-match semantic flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/nova-sema/src/analyzer.rs")
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old!r}")
              text = text.replace(old, new)

          replace_once(
              "        let post_scrutinee_loop_stack = self.loop_stack.clone();\n        let mut scrutinee_enum = match &scrutinee.ty {",
              "        let post_scrutinee_loop_stack = self.loop_stack.clone();\n        let selected_variant = match (&scrutinee.kind, &scrutinee.ty) {\n            (ExpressionKind::EnumConstructor { variant_index, .. }, Type::Enum(_)) => {\n                Some(*variant_index)\n            }\n            _ => None,\n        };\n        let mut scrutinee_enum = match &scrutinee.ty {",
          )
          replace_once(
              "        let mut branch_states = Vec::with_capacity(arms.len());\n        let mut branch_types = Vec::with_capacity(arms.len());\n        let mut structural_error = scrutinee_enum.is_none() && !scrutinee.ty.is_never();",
              "        let mut branch_states = Vec::with_capacity(arms.len());\n        let mut branch_types = Vec::with_capacity(arms.len());\n        let mut selected_branch = None::<(ScopeState, Type)>;\n        let mut structural_error = scrutinee_enum.is_none() && !scrutinee.ty.is_never();",
          )
          replace_once(
              "            let value = self.lower_expression(&arm.value, return_type);\n            let popped = self.scopes.pop();\n            debug_assert!(popped.is_some());\n            branch_states.push((self.scopes.clone(), value.ty.is_never()));\n            branch_types.push((value.ty.clone(), value.span));",
              "            let selected_arm = selected_variant\n                .is_some_and(|selected| valid_pattern && resolved_index == Some(selected));\n            let value = if selected_variant.is_some() && !selected_arm {\n                self.lower_expression_for_diagnostics(&arm.value, return_type)\n            } else {\n                self.lower_expression(&arm.value, return_type)\n            };\n            let popped = self.scopes.pop();\n            debug_assert!(popped.is_some());\n            let branch_state = self.scopes.clone();\n            branch_states.push((branch_state.clone(), value.ty.is_never()));\n            branch_types.push((value.ty.clone(), value.span));\n            if selected_arm {\n                selected_branch = Some((branch_state, value.ty.clone()));\n            }",
          )
          replace_once(
              "        } else {\n            self.merge_match_initialization(&entry_scopes, &branch_states);\n            joined_type\n        };",
              "        } else if selected_variant.is_some() {\n            let (selected_scopes, selected_type) = selected_branch\n                .expect(\"a valid exhaustive match must contain the constructed variant\");\n            self.scopes = selected_scopes;\n            if joined_type.is_error() {\n                Type::Error\n            } else {\n                selected_type\n            }\n        } else {\n            self.merge_match_initialization(&entry_scopes, &branch_states);\n            joined_type\n        };",
          )

          path.write_text(text)
          PY
          cargo fmt --all
      - name: Validate semantic slice
        run: cargo test -p nova-sema --all-targets --locked
      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/nova-sema/src/analyzer.rs crates/nova-sema/tests/direct_match_dataflow.rs
          git commit -m "fix: align direct-match semantic reachability"
          git push origin HEAD:feat/direct-match-dataflow
