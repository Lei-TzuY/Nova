name: One-shot short-circuit proof patch

on:
  push:
    branches: [fix/composite-short-circuit-never]
    paths:
      - .github/workflows/one-shot-short-circuit-proof-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/composite-short-circuit-never
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Align short-circuit typing with closed proof and self-delete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          analyzer = Path("crates/nova-sema/src/analyzer.rs")
          text = analyzer.read_text()
          old = (
              "        let left_literal = match &left.kind {\n"
              "            ExpressionKind::Boolean(value) => Some(*value),\n"
              "            _ => None,\n"
              "        };\n"
          )
          new = "        let left_literal = crate::constant_condition::evaluate(left);\n"
          assert text.count(old) == 1, "short-circuit literal anchor drifted"
          analyzer.write_text(text.replace(old, new, 1))
          PY

          cargo fmt --all
          rm .github/workflows/one-shot-short-circuit-proof-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/nova-sema/src/analyzer.rs crates/nova-sema/tests/composite_short_circuit_never.rs .github/workflows/one-shot-short-circuit-proof-patch.yml
          git diff --cached --check
          git commit -m "fix: align composite short-circuit noncontinuation"
          git push origin HEAD:fix/composite-short-circuit-never
