name: CFG edge direction verifier patch

on:
  push:
    branches:
      - fix/cfg-edge-direction

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cfg-edge-direction
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply and validate CFG edge direction patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/cfg_edge_direction_patch.py
          cargo fmt --all
          cargo test -p nova-sema --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          rm .github/cfg_edge_direction_patch.py .github/workflows/cfg-edge-direction-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: enforce CFG edge direction canonicality'
          git push origin HEAD:fix/cfg-edge-direction
