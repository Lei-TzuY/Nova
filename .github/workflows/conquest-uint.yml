name: Conquest UInt vertical slice

on:
  push:
    branches: [bil-5-uint-family]

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[conquest-result]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bil-5-uint-family
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Implement UInt family
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()
          def write(path, text):
              Path(path).write_text(text)
          def once(text, old, new, path):
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence, got {text.count(old)}: {old[:80]!r}")
              return text.replace(old, new, 1)

          # HIR: a distinct unsigned family and explicit conversion nodes.
          p = 'crates/nova-sema/src/hir.rs'; s = read(p)
          s = once(s, '    /// Boolean type.\n    Bool,', '    /// Unsigned 64-bit integer type.\n    UInt,\n    /// Boolean type.\n    Bool,', p)
          s = once(s, '            Self::Int => formatter.write_str("Int"),\n            Self::Bool =>', '            Self::Int => formatter.write_str("Int"),\n            Self::UInt => formatter.write_str("UInt"),\n            Self::Bool =>', p)
          s = once(s, '    /// Decoded UTF-8 string literal.\n    String(String),', '    /// Unsigned integer value introduced by the UInt numeric surface.\n    Unsigned(u64),\n    /// Decoded UTF-8 string literal.\n    String(String),', p)
          s = once(s, '    /// Function invocation.\n    Call {', '    /// Checked explicit conversion from signed Int to UInt.\n    IntToUInt {\n        /// Operand evaluated exactly once.\n        operand: Box<Expression>,\n    },\n    /// Checked explicit conversion from UInt to signed Int.\n    UIntToInt {\n        /// Operand evaluated exactly once.\n        operand: Box<Expression>,\n    },\n    /// Function invocation.\n    Call {', p)
          write(p, s)

          # Sema: reserve/resolve UInt, recognize built-in constants/conversions, and type same-family operators.
          p = 'crates/nova-sema/src/analyzer.rs'; s = read(p)
          s = once(s, 'matches!(name.text.as_str(), "Int" | "Bool" | "String" | "Unit")', 'matches!(name.text.as_str(), "Int" | "UInt" | "Bool" | "String" | "Unit")', p)
          s = once(s, '                "Int" => Type::Int,\n                "Bool" => Type::Bool,', '                "Int" => Type::Int,\n                "UInt" => Type::UInt,\n                "Bool" => Type::Bool,', p)

          marker = '''        let payload_error = payload\n            .as_deref()\n            .is_some_and(|expression| expression.ty.is_error());\n\n        let Some(symbol) = self.module.types.get(&enumeration.text).copied() else {'''
          replacement = '''        let payload_error = payload\n            .as_deref()\n            .is_some_and(|expression| expression.ty.is_error());\n\n        if enumeration.text == "UInt" {\n            let ty = if payload_never { Type::Never } else { Type::UInt };\n            return match (variant.text.as_str(), payload) {\n                ("MIN", None) => (ExpressionKind::Unsigned(0), Type::UInt),\n                ("MAX", None) => (ExpressionKind::Unsigned(u64::MAX), Type::UInt),\n                ("from", Some(operand)) => {\n                    self.require_type(&operand.ty, &Type::Int, operand.span, "UInt::from operand");\n                    if operand.ty.is_never() {\n                        (ExpressionKind::IntToUInt { operand }, Type::Never)\n                    } else if operand.ty.is_error() || operand.ty != Type::Int {\n                        self.restore_reachable_state(aggregate_entry_state);\n                        (ExpressionKind::Error, Type::Error)\n                    } else {\n                        (ExpressionKind::IntToUInt { operand }, Type::UInt)\n                    }\n                }\n                ("from", None) => {\n                    self.diagnostics.push(\n                        Diagnostic::error("N3022", "missing numeric conversion operand")\n                            .with_primary(variant.span, "`UInt::from` requires one Int operand"),\n                    );\n                    self.restore_reachable_state(aggregate_entry_state);\n                    (ExpressionKind::Error, Type::Error)\n                }\n                ("MIN" | "MAX", Some(actual)) => {\n                    self.diagnostics.push(\n                        Diagnostic::error("N3022", "unexpected numeric constant payload")\n                            .with_primary(actual.span, format!("`UInt::{}` does not accept a payload", variant.text)),\n                    );\n                    self.restore_reachable_state(aggregate_entry_state);\n                    (ExpressionKind::Error, Type::Error)\n                }\n                _ => {\n                    self.diagnostics.push(\n                        Diagnostic::error("N3021", "unknown UInt member")\n                            .with_primary(variant.span, format!("UInt has no member named `{}`", variant.text))\n                            .with_note("available bootstrap members are `MIN`, `MAX`, and `from(Int)`"),\n                    );\n                    self.restore_reachable_state(aggregate_entry_state);\n                    (ExpressionKind::Error, if payload_never { Type::Never } else { Type::Error })\n                }\n            };\n        }\n\n        if enumeration.text == "Int" && variant.text == "from_uint" {\n            return match payload {\n                Some(operand) => {\n                    self.require_type(&operand.ty, &Type::UInt, operand.span, "Int::from_uint operand");\n                    if operand.ty.is_never() {\n                        (ExpressionKind::UIntToInt { operand }, Type::Never)\n                    } else if operand.ty.is_error() || operand.ty != Type::UInt {\n                        self.restore_reachable_state(aggregate_entry_state);\n                        (ExpressionKind::Error, Type::Error)\n                    } else {\n                        (ExpressionKind::UIntToInt { operand }, Type::Int)\n                    }\n                }\n                None => {\n                    self.diagnostics.push(\n                        Diagnostic::error("N3022", "missing numeric conversion operand")\n                            .with_primary(variant.span, "`Int::from_uint` requires one UInt operand"),\n                    );\n                    self.restore_reachable_state(aggregate_entry_state);\n                    (ExpressionKind::Error, Type::Error)\n                }\n            };\n        }\n\n        let Some(symbol) = self.module.types.get(&enumeration.text).copied() else {'''
          s = once(s, marker, replacement, p)

          old = '''            BinaryOperator::Add\n            | BinaryOperator::Subtract\n            | BinaryOperator::Multiply\n            | BinaryOperator::Divide\n            | BinaryOperator::Remainder => {\n                self.require_binary_operands(left, right, &Type::Int, span, "arithmetic operator");\n                let ty = strict_binary_result_type(&left.ty, &right.ty, &Type::Int, Type::Int);\n                if ty == Type::Int\n                    && self.checked_constant_int_failure(\n                        constant_int::evaluate_binary_checked(operator, left, right),\n                        span,\n                    )\n                {\n                    Type::Error\n                } else {\n                    ty\n                }\n            }\n            BinaryOperator::Less\n            | BinaryOperator::LessEqual\n            | BinaryOperator::Greater\n            | BinaryOperator::GreaterEqual => {\n                self.require_binary_operands(left, right, &Type::Int, span, "comparison operator");\n                strict_binary_result_type(&left.ty, &right.ty, &Type::Int, Type::Bool)\n            }'''
          new = '''            BinaryOperator::Add\n            | BinaryOperator::Subtract\n            | BinaryOperator::Multiply\n            | BinaryOperator::Divide\n            | BinaryOperator::Remainder => {\n                let expected = if left.ty == Type::UInt || right.ty == Type::UInt {\n                    Type::UInt\n                } else {\n                    Type::Int\n                };\n                self.require_binary_operands(left, right, &expected, span, "arithmetic operator");\n                let ty = strict_binary_result_type(&left.ty, &right.ty, &expected, expected.clone());\n                if ty == Type::Int\n                    && self.checked_constant_int_failure(\n                        constant_int::evaluate_binary_checked(operator, left, right),\n                        span,\n                    )\n                {\n                    Type::Error\n                } else {\n                    ty\n                }\n            }\n            BinaryOperator::Less\n            | BinaryOperator::LessEqual\n            | BinaryOperator::Greater\n            | BinaryOperator::GreaterEqual => {\n                let expected = if left.ty == Type::UInt || right.ty == Type::UInt {\n                    Type::UInt\n                } else {\n                    Type::Int\n                };\n                self.require_binary_operands(left, right, &expected, span, "comparison operator");\n                strict_binary_result_type(&left.ty, &right.ty, &expected, Type::Bool)\n            }'''
          s = once(s, old, new, p)
          write(p, s)

          # Equality contract.
          p = 'crates/nova-sema/src/equality_rules.rs'; s = read(p)
          s = once(s, 'Type::Int | Type::Bool | Type::String | Type::Unit | Type::Function(_) => true,', 'Type::Int | Type::UInt | Type::Bool | Type::String | Type::Unit | Type::Function(_) => true,', p)
          write(p, s)

          # Interpreter runtime representation, checked unsigned arithmetic and explicit conversions.
          p = 'crates/nova-interpreter/src/lib.rs'; s = read(p)
          s = once(s, '    /// Boolean value.\n    Bool(bool),', '    /// Unsigned 64-bit integer value.\n    UInt(u64),\n    /// Boolean value.\n    Bool(bool),', p)
          s = once(s, '            Self::Int(value) => write!(formatter, "{value}"),\n            Self::Bool(value) =>', '            Self::Int(value) => write!(formatter, "{value}"),\n            Self::UInt(value) => write!(formatter, "{value}"),\n            Self::Bool(value) =>', p)
          s = s.replace('`Int`, `Bool`, `String`, or `Unit`', '`Int`, `UInt`, `Bool`, `String`, or `Unit`')
          s = once(s, '            Type::Int | Type::Bool | Type::String | Type::Unit\n', '            Type::Int | Type::UInt | Type::Bool | Type::String | Type::Unit\n', p)
          s = once(s, '            ExpressionKind::Integer(value) => Ok(Flow::Value(Value::Int(*value))),\n            ExpressionKind::String(value) =>', '            ExpressionKind::Integer(value) => Ok(Flow::Value(Value::Int(*value))),\n            ExpressionKind::Unsigned(value) => Ok(Flow::Value(Value::UInt(*value))),\n            ExpressionKind::String(value) =>', p)
          s = once(s, '            ExpressionKind::Call { callee, arguments } => {', '''            ExpressionKind::IntToUInt { operand } => {\n                let operand = match self.eval_expression(operand, frame)? {\n                    Flow::Value(value) => value,\n                    flow => return Ok(flow),\n                };\n                match operand {\n                    Value::Int(value) if value >= 0 => Ok(Flow::Value(Value::UInt(value as u64))),\n                    Value::Int(_) => Err(self.numeric_conversion_range(expression, "negative Int cannot be represented as UInt")),\n                    _ => Err(self.invariant(expression.span, "Int-to-UInt conversion received the wrong runtime value")),\n                }\n            }\n            ExpressionKind::UIntToInt { operand } => {\n                let operand = match self.eval_expression(operand, frame)? {\n                    Flow::Value(value) => value,\n                    flow => return Ok(flow),\n                };\n                match operand {\n                    Value::UInt(value) if value <= i64::MAX as u64 => Ok(Flow::Value(Value::Int(value as i64))),\n                    Value::UInt(_) => Err(self.numeric_conversion_range(expression, "UInt value exceeds Int::MAX")),\n                    _ => Err(self.invariant(expression.span, "UInt-to-Int conversion received the wrong runtime value")),\n                }\n            }\n            ExpressionKind::Call { callee, arguments } => {''', p)

          anchor = '''            (BinaryOperator::Add, Value::Int(left), Value::Int(right)) => {\n                self.int_result(int_semantics::add(left, right), expression)\n            }'''
          uint_ops = anchor + '''\n            (BinaryOperator::Add, Value::UInt(left), Value::UInt(right)) => left\n                .checked_add(right)\n                .map(Value::UInt)\n                .ok_or_else(|| self.overflow(expression)),'''
          s = once(s, anchor, uint_ops, p)
          anchor = '''            (BinaryOperator::Subtract, Value::Int(left), Value::Int(right)) => {\n                self.int_result(int_semantics::subtract(left, right), expression)\n            }'''
          s = once(s, anchor, anchor + '''\n            (BinaryOperator::Subtract, Value::UInt(left), Value::UInt(right)) => left\n                .checked_sub(right)\n                .map(Value::UInt)\n                .ok_or_else(|| self.overflow(expression)),''', p)
          anchor = '''            (BinaryOperator::Multiply, Value::Int(left), Value::Int(right)) => {\n                self.int_result(int_semantics::multiply(left, right), expression)\n            }'''
          s = once(s, anchor, anchor + '''\n            (BinaryOperator::Multiply, Value::UInt(left), Value::UInt(right)) => left\n                .checked_mul(right)\n                .map(Value::UInt)\n                .ok_or_else(|| self.overflow(expression)),''', p)
          anchor = '''            (BinaryOperator::Divide, Value::Int(left), Value::Int(right)) => {\n                self.int_result(int_semantics::divide(left, right), expression)\n            }'''
          s = once(s, anchor, anchor + '''\n            (BinaryOperator::Divide, Value::UInt(_), Value::UInt(0)) => Err(self.zero_divisor(expression)),\n            (BinaryOperator::Divide, Value::UInt(left), Value::UInt(right)) => Ok(Value::UInt(left / right)),''', p)
          anchor = '''            (BinaryOperator::Remainder, Value::Int(left), Value::Int(right)) => {\n                self.int_result(int_semantics::remainder(left, right), expression)\n            }'''
          s = once(s, anchor, anchor + '''\n            (BinaryOperator::Remainder, Value::UInt(_), Value::UInt(0)) => Err(self.zero_divisor(expression)),\n            (BinaryOperator::Remainder, Value::UInt(left), Value::UInt(right)) => Ok(Value::UInt(left % right)),''', p)
          for op, rust in [('Less','<'),('LessEqual','<='),('Greater','>'),('GreaterEqual','>=')]:
              anchor = f'''            (BinaryOperator::{op}, Value::Int(left), Value::Int(right)) => {{\n                Ok(Value::Bool(left {rust} right))\n            }}'''
              s = once(s, anchor, anchor + f'''\n            (BinaryOperator::{op}, Value::UInt(left), Value::UInt(right)) => {{\n                Ok(Value::Bool(left {rust} right))\n            }}''', p)
          anchor = '''            (BinaryOperator::Equal, Value::Int(left), Value::Int(right)) => {\n                Ok(Value::Bool(left == right))\n            }'''
          s = once(s, anchor, anchor + '''\n            (BinaryOperator::Equal, Value::UInt(left), Value::UInt(right)) => {\n                Ok(Value::Bool(left == right))\n            }''', p)
          anchor = '''            (BinaryOperator::NotEqual, Value::Int(left), Value::Int(right)) => {\n                Ok(Value::Bool(left != right))\n            }'''
          s = once(s, anchor, anchor + '''\n            (BinaryOperator::NotEqual, Value::UInt(left), Value::UInt(right)) => {\n                Ok(Value::Bool(left != right))\n            }''', p)
          s = once(s, '            Type::Int | Type::Bool | Type::String | Type::Unit => true,', '            Type::Int | Type::UInt | Type::Bool | Type::String | Type::Unit => true,', p)
          s = once(s, '            (Value::Int(_), Type::Int)\n            | (Value::Bool(_), Type::Bool)', '            (Value::Int(_), Type::Int)\n            | (Value::UInt(_), Type::UInt)\n            | (Value::Bool(_), Type::Bool)', p)
          s = once(s, '''    fn zero_divisor(&self, expression: &Expression) -> Diagnostic {\n        Diagnostic::error("N4003", "division by zero")\n            .with_primary(expression.span, "zero divisor is not executable")\n    }''', '''    fn numeric_conversion_range(&self, expression: &Expression, detail: &str) -> Diagnostic {\n        Diagnostic::error("N4007", "numeric conversion out of range")\n            .with_primary(expression.span, detail)\n            .with_note("explicit Int/UInt conversions are checked; they never wrap or saturate")\n    }\n\n    fn zero_divisor(&self, expression: &Expression) -> Diagnostic {\n        Diagnostic::error("N4003", "division by zero")\n            .with_primary(expression.span, "zero divisor is not executable")\n    }''', p)
          s = once(s, '"bootstrap Int arithmetic is checked signed 64-bit execution",', '"bootstrap Int/UInt arithmetic is checked 64-bit execution",', p)
          write(p, s)

          # Inspection representation shared by the currently versioned schema family.
          p = 'crates/nova-inspect/src/v1.rs'; s = read(p)
          s = once(s, '    /// Surface `Bool`.\n    Bool,', '    /// Surface `UInt`.\n    UInt,\n    /// Surface `Bool`.\n    Bool,', p)
          s = once(s, '    /// String literal; emitted only by schema v4 and later.\n    String,', '    /// Unsigned integer literal.\n    UnsignedInteger,\n    /// String literal; emitted only by schema v4 and later.\n    String,', p)
          s = once(s, '    /// Function invocation.\n    Call,', '    /// Explicit checked conversion between numeric families.\n    NumericConversion,\n    /// Function invocation.\n    Call,', p)
          write(p, s)

          p = 'crates/nova-inspect/src/lib.rs'; s = read(p)
          s = once(s, 'for ty in [Type::Int, Type::Bool] {', 'for ty in [Type::Int, Type::UInt, Type::Bool] {', p)
          s = once(s, '                    Type::Int => (v1::TypeKind::Int, None, Vec::new(), None),\n                    Type::Bool =>', '                    Type::Int => (v1::TypeKind::Int, None, Vec::new(), None),\n                    Type::UInt => (v1::TypeKind::UInt, None, Vec::new(), None),\n                    Type::Bool =>', p)
          s = once(s, '            hir::ExpressionKind::Integer(_) => v1::ExpressionKind::Integer,\n            hir::ExpressionKind::String(_) => {', '''            hir::ExpressionKind::Integer(_) => v1::ExpressionKind::Integer,\n            hir::ExpressionKind::Unsigned(_) => {\n                if expression.ty != Type::UInt {\n                    return Err(InspectionError::invalid(format!(\n                        "unsigned literal expression has HIR type {} instead of UInt",\n                        expression.ty\n                    )));\n                }\n                v1::ExpressionKind::UnsignedInteger\n            }\n            hir::ExpressionKind::String(_) => {''', p)
          anchor = '''            hir::ExpressionKind::Unary {\n                operator: resolved,'''
          conversion = '''            hir::ExpressionKind::IntToUInt { operand } => {\n                if expression.ty != Type::UInt || operand.ty != Type::Int {\n                    return Err(InspectionError::invalid("IntToUInt HIR conversion has inconsistent types"));\n                }\n                operator = Some("int_to_uint".to_owned());\n                children.push(self.collect_expression(operand, owner)?);\n                v1::ExpressionKind::NumericConversion\n            }\n            hir::ExpressionKind::UIntToInt { operand } => {\n                if expression.ty != Type::Int || operand.ty != Type::UInt {\n                    return Err(InspectionError::invalid("UIntToInt HIR conversion has inconsistent types"));\n                }\n                operator = Some("uint_to_int".to_owned());\n                children.push(self.collect_expression(operand, owner)?);\n                v1::ExpressionKind::NumericConversion\n            }\n'''
          s = once(s, anchor, conversion + anchor, p)
          # Scalar validation arm used by the document boundary.
          s = s.replace('            Type::Int\n            | Type::Bool', '            Type::Int\n            | Type::UInt\n            | Type::Bool')
          write(p, s)

          # Schemas: all versions ultimately expose v1 type/expression categories or carry copies.
          for path in Path('docs/schemas').glob('semantic-inspection-v*.schema.json'):
              s = path.read_text()
              s = s.replace('"int", "bool"', '"int", "uint", "bool"')
              s = s.replace('"integer", "string", "boolean"', '"integer", "unsigned_integer", "string", "boolean"')
              s = s.replace('"integer", "boolean"', '"integer", "unsigned_integer", "boolean"')
              # Place conversion adjacent to unary/binary in every copied expression-kind enum.
              s = s.replace('"unary", "binary", "call"', '"unary", "binary", "numeric_conversion", "call"')
              path.write_text(s)

          # Normative docs and compact surface summary.
          p = 'docs/numeric-semantics.md'; s = read(p)
          s = s.replace('Literal suffixes, floating-point semantics, additional numeric families,\nwidening/narrowing policy, and backend representation beyond this signed-64 contract\nremain future BIL-5 work and must be specified before syntax is added for them.', '''Nova now has two integer families: signed 64-bit `Int` and unsigned 64-bit `UInt`.\nUnsuffixed decimal literals continue to default to `Int`; there is no implicit conversion\nbetween the families. `UInt::MIN` is `0`, `UInt::MAX` is `2^64 - 1`, and same-family\n`UInt` arithmetic and ordering are checked unsigned 64-bit operations. Overflow and\nunderflow report runtime `N4002`; zero divisors report `N4003`. Unary negation remains\n`Int`-only.\n\n`UInt::from(Int)` is the explicit widening-domain conversion and rejects negative values\nwith runtime `N4007`. `Int::from_uint(UInt)` is the explicit narrowing conversion and\nrejects values above `Int::MAX` with `N4007`. Both evaluate their operand exactly once,\nnever wrap or saturate, and mixed-family arithmetic remains a type error.\n\nLiteral suffixes, floating-point semantics, additional numeric families, richer defaulting,\nand backend representation beyond these 64-bit contracts remain future BIL-5 work.''')
          write(p, s)

          p = 'README.md'; s = read(p)
          s = s.replace('`Int`, `Bool`, `String`, `Unit`, and declared nominal records and enums', '`Int`, `UInt`, `Bool`, `String`, `Unit`, and declared nominal records and enums')
          write(p, s)

          p = 'docs/language-constitution.md'; s = read(p)
          s = s.replace('surface types `Int`, `Bool`, `String`, `Unit`', 'surface types `Int`, `UInt`, `Bool`, `String`, `Unit`')
          write(p, s)

          # End-to-end CLI contract.
          Path('crates/nova-cli/tests/uint_numeric.rs').write_text(r'''use std::io::Write;\nuse std::process::{Command, Output, Stdio};\n\nfn run_stdin(arguments: &[&str], source: &str) -> Output {\n    let mut child = Command::new(env!("CARGO_BIN_EXE_nova"))\n        .args(arguments)\n        .stdin(Stdio::piped())\n        .stdout(Stdio::piped())\n        .stderr(Stdio::piped())\n        .spawn()\n        .expect("nova command starts");\n    child.stdin.as_mut().expect("stdin is piped").write_all(source.as_bytes()).expect("source is written");\n    child.wait_with_output().expect("nova command completes")\n}\n\n#[test]\nfn uint_executes_through_check_run_and_inspect() {\n    let source = "fn main() -> UInt { UInt::from(40) + UInt::from(2) }";\n    assert!(run_stdin(&["check", "-"], source).status.success());\n    let run = run_stdin(&["run", "-"], source);\n    assert!(run.status.success(), "{}", String::from_utf8_lossy(&run.stderr));\n    assert_eq!(String::from_utf8_lossy(&run.stdout), "42\\n");\n    let inspect = run_stdin(&["inspect", "-", "--format=json", "--schema-version", "6"], source);\n    assert!(inspect.status.success(), "{}", String::from_utf8_lossy(&inspect.stderr));\n    let json = String::from_utf8_lossy(&inspect.stdout);\n    assert!(json.contains("\\\"uint\\\""));\n    assert!(json.contains("numeric_conversion"));\n}\n\n#[test]\nfn uint_boundaries_and_checked_narrowing_execute() {\n    let max = run_stdin(&["run", "-"], "fn main() -> UInt { UInt::MAX }");\n    assert!(max.status.success(), "{}", String::from_utf8_lossy(&max.stderr));\n    assert_eq!(String::from_utf8_lossy(&max.stdout), "18446744073709551615\\n");\n    let narrow = run_stdin(&["run", "-"], "fn main() -> Int { Int::from_uint(UInt::from(42)) }");\n    assert!(narrow.status.success(), "{}", String::from_utf8_lossy(&narrow.stderr));\n    assert_eq!(String::from_utf8_lossy(&narrow.stdout), "42\\n");\n}\n\n#[test]\nfn explicit_cross_family_conversions_are_checked() {\n    for source in [\n        "fn main() -> UInt { UInt::from(-1) }",\n        "fn main() -> Int { Int::from_uint(UInt::MAX) }",\n    ] {\n        let output = run_stdin(&["run", "-"], source);\n        assert!(!output.status.success());\n        assert!(String::from_utf8_lossy(&output.stderr).contains("N4007"));\n    }\n}\n\n#[test]\nfn uint_arithmetic_is_checked_and_zero_division_is_rejected() {\n    for (source, code) in [\n        ("fn main() -> UInt { UInt::MAX + UInt::from(1) }", "N4002"),\n        ("fn main() -> UInt { UInt::MIN - UInt::from(1) }", "N4002"),\n        ("fn main() -> UInt { UInt::from(4) / UInt::MIN }", "N4003"),\n    ] {\n        let output = run_stdin(&["run", "-"], source);\n        assert!(!output.status.success());\n        assert!(String::from_utf8_lossy(&output.stderr).contains(code));\n    }\n}\n\n#[test]\nfn uint_has_no_implicit_int_conversion_and_rejects_bad_members() {\n    for source in [\n        "fn main() -> UInt { UInt::from(1) + 2 }",\n        "fn main() -> UInt { UInt::from(true) }",\n        "fn main() -> UInt { UInt::from }",\n        "fn main() -> UInt { UInt::wat }",\n    ] {\n        let output = run_stdin(&["check", "-"], source);\n        assert!(!output.status.success(), "source unexpectedly accepted: {source}");\n        assert!(!String::from_utf8_lossy(&output.stderr).trim().is_empty());\n    }\n}\n'''.replace('\\n', '\n'))
          PY

          cargo fmt --all

          set +e
          : > conquest-result.log
          run_gate() { echo "### $*" >> conquest-result.log; "$@" >> conquest-result.log 2>&1; rc=$?; echo "exit=$rc" >> conquest-result.log; return $rc; }
          failed=0
          run_gate cargo fmt --all -- --check || failed=1
          run_gate cargo clippy --workspace --all-targets --all-features --locked -- -D warnings || failed=1
          run_gate cargo +1.85.0 check --workspace --all-targets --locked || failed=1
          run_gate cargo test --workspace --all-targets --locked || failed=1
          run_gate cargo build --workspace --all-targets --locked || failed=1
          echo '### cargo doc' >> conquest-result.log
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked >> conquest-result.log 2>&1 || failed=1
          echo "overall_failed=$failed" >> conquest-result.log

          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          if [ "$failed" -eq 0 ]; then
            rm -f conquest-result.log .github/workflows/conquest-uint.yml
            git add -A
            git commit -m '[conquest-result] feat: add checked UInt numeric family'
            git push origin HEAD:bil-5-uint-family
          else
            git add -A
            git commit -m '[conquest-result] chore: capture UInt implementation diagnostics'
            git push origin HEAD:bil-5-uint-family
            exit 1
          fi