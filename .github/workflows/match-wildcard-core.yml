name: Match wildcard core

on:
  push:
    branches: [feat/match-wildcard]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/match-wildcard
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply and validate match wildcard core
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/match-wildcard-core.py')
          text = path.read_text()
          old = 'runtime_match + "            ExpressionKind::Error =>",'
          if text.count(old) != 1:
              raise SystemExit('unexpected interpreter replacement boundary')
          text = text.replace(old, 'runtime_match,', 1)
          old = '''            branch_states.push(branch_state);\n            branch_types.push((value.ty.clone(), value.span));'''
          new = '''            if generally_useful && valid_pattern {\n                branch_states.push(branch_state);\n            }\n            branch_types.push((value.ty.clone(), value.span));'''
          if text.count(old) != 1:
              raise SystemExit('unexpected match-flow merge anchor')
          path.write_text(text.replace(old, new, 1))
          PY
          python .github/match-wildcard-core.py
          python - <<'PY'
          from pathlib import Path

          p = Path('crates/nova-interpreter/tests/enum_variant_identity.rs')
          text = p.read_text()
          text = text.replace(
              'hir::{ExpressionKind, StatementKind},',
              'hir::{ExpressionKind, MatchArmPattern, StatementKind},',
              1,
          )
          text = text.replace(
              '    arms[0].variant_index = 1;\n    arms[1].variant_index = 0;\n',
              '''    let MatchArmPattern::Variant { variant_index: first, .. } = &mut arms[0].pattern else { panic!("variant arm"); };\n    *first = 1;\n    let MatchArmPattern::Variant { variant_index: second, .. } = &mut arms[1].pattern else { panic!("variant arm"); };\n    *second = 0;\n''',
              1,
          )
          text = text.replace(
              '    arms[0].variant_index = 99;\n',
              '''    let MatchArmPattern::Variant { variant_index, .. } = &mut arms[0].pattern else { panic!("variant arm"); };\n    *variant_index = 99;\n''',
              1,
          )
          p.write_text(text)

          p = Path('crates/nova-interpreter/tests/pattern_payload_discard.rs')
          text = p.read_text()
          text = text.replace(
              'use nova_sema::{analyze, hir::ExpressionKind};',
              'use nova_sema::{analyze, hir::{ExpressionKind, MatchArmPattern}};',
              1,
          )
          text = text.replace(
              '    arms[1].binding = None;\n    assert!(!arms[1].payload_discarded);\n',
              '''    let MatchArmPattern::Variant { binding, payload_discarded, .. } = &mut arms[1].pattern else { panic!("variant arm"); };\n    *binding = None;\n    assert!(!*payload_discarded);\n''',
              1,
          )
          p.write_text(text)
          PY
          cargo fmt --all
          cargo test -p nova-parser --test match_wildcard --locked
          cargo test -p nova-sema --test match_wildcard --locked
          cargo test -p nova-interpreter --test match_wildcard --locked
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git rm -f .github/match-wildcard-core.py .github/workflows/match-wildcard-core.yml
          git add crates
          git commit -m "feat: add match wildcard core semantics"
          git push origin HEAD:feat/match-wildcard
