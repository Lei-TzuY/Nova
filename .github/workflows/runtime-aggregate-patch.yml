name: Runtime aggregate boundary patch

on:
  push:
    branches:
      - fix/runtime-aggregate-boundary-integrity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-aggregate-boundary-integrity
          fetch-depth: 0
      - name: Apply focused patch
        run: python .github/runtime_aggregate_patch.py
      - name: Format and commit
        shell: bash
        run: |
          cargo fmt --all
          rm .github/runtime_aggregate_patch.py
          rm .github/workflows/runtime-aggregate-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/nova-interpreter/src/lib.rs crates/nova-interpreter/tests/aggregate_boundary_integrity.rs README.md docs/roadmap.md .github/runtime_aggregate_patch.py .github/workflows/runtime-aggregate-patch.yml
          git commit -m 'fix: validate runtime aggregate construction'
          git push origin HEAD:fix/runtime-aggregate-boundary-integrity
