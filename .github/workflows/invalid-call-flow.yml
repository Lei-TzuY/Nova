name: Validate invalid call flow fix

on:
  push:
    branches:
      - fix/invalid-call-flow

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/invalid-call-flow
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Compile new regression target
        run: cargo test -p nova-sema --test invalid_call_flow --locked --no-run
      - name: Confirm new regression is red
        shell: bash
        run: |
          if cargo test -p nova-sema --test invalid_call_flow --locked; then
            echo "expected invalid-call-flow regressions to fail before the fix" >&2
            exit 1
          fi
      - name: Apply call recovery fix
        run: python3 scripts/apply_invalid_call_flow.py
      - name: Validate fixed semantic slice
        run: |
          cargo fmt --all
          cargo test -p nova-sema --all-targets --locked
          cargo clippy -p nova-sema --all-targets --all-features -- -D warnings
      - name: Commit fix and remove helpers
        run: |
          rm .github/workflows/invalid-call-flow.yml scripts/apply_invalid_call_flow.py
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "fix: fail closed on invalid calls"
          git push origin HEAD:fix/invalid-call-flow
