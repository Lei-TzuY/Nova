name: Conquest BIL-28 inspect v8

on:
  push:
    branches:
      - conquest/bil-28-shared-mutable-capture

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/bil-28-shared-mutable-capture
          fetch-depth: 0
      - name: Apply inspection v8
        run: python3 scripts/bil28_inspect.py
      - name: Format
        run: cargo fmt --all
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build docs
        run: cargo doc --workspace --no-deps
      - name: Commit implementation
        shell: bash
        run: |
          rm -f scripts/bil28_inspect.py .github/workflows/conquest-bil28-inspect.yml
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add -A
          git commit -m 'feat: expose shared captures in inspection v8'
          git push origin HEAD:conquest/bil-28-shared-mutable-capture
