name: BIL-37 compatibility

on:
  push:
    branches:
      - conquest/bil-37-explicit-generic-arguments

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compatibility patch
        run: python3 .github/bil37_patch.py
      - name: Persist and check
        run: |
          cargo fmt --all
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add crates/nova-parser/tests/lambda_expressions.rs
          git commit -m "test: keep lambda call parsing compatible"
          git push origin HEAD:conquest/bil-37-explicit-generic-arguments
          cargo check --workspace --all-targets
