name: BIL-37 implementation

on:
  push:
    branches:
      - conquest/bil-37-explicit-generic-arguments

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply and persist explicit generic call candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              old = dedent(old).strip("\n")
              new = dedent(new).strip("\n")
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace("crates/nova-parser/src/ast.rs", '''
          Call {
              /// Expression producing the callee.
              callee: Box<Expression>,
              /// Arguments in source order.
              arguments: Vec<Expression>,
          },
          ''', '''
          Call {
              /// Expression producing the callee.
              callee: Box<Expression>,
              /// Explicit call-site type arguments in source order.
              type_arguments: Vec<TypeRef>,
              /// Value arguments in source order.
              arguments: Vec<Expression>,
          },
          ''')

          replace("crates/nova-parser/src/parser.rs", '''
          if self.at(TokenKind::LeftParen) {
              if POSTFIX_BINDING_POWER < minimum {
                  break;
              }
              left = self.parse_call_expression(left)?;
              continue;
          }
          if self.at(TokenKind::Dot) {
          ''', '''
          if self.at(TokenKind::LeftParen) {
              if POSTFIX_BINDING_POWER < minimum {
                  break;
              }
              left = self.parse_call_expression(left, Vec::new())?;
              continue;
          }
          if self.at(TokenKind::Less)
              && POSTFIX_BINDING_POWER >= minimum
              && matches!(left.kind, ExpressionKind::Name(_))
          {
              let checkpoint = self.position;
              let diagnostic_checkpoint = self.diagnostics.len();
              if let Some(type_arguments) = self.parse_explicit_call_type_arguments() {
                  if self.at(TokenKind::LeftParen) {
                      left = self.parse_call_expression(left, type_arguments)?;
                      continue;
                  }
              }
              self.position = checkpoint;
              self.diagnostics.truncate(diagnostic_checkpoint);
          }
          if self.at(TokenKind::Dot) {
          ''')

          replace("crates/nova-parser/src/parser.rs", '''
          fn parse_call_expression(&mut self, callee: Expression) -> Option<Expression> {
              self.expect(TokenKind::LeftParen, "to start the argument list")?;
          ''', '''
          fn parse_explicit_call_type_arguments(&mut self) -> Option<Vec<TypeRef>> {
              self.expect(TokenKind::Less, "to start explicit call type arguments")?;
              if self.at(TokenKind::Greater) {
                  return None;
              }
              let mut arguments = Vec::new();
              loop {
                  arguments.push(self.parse_type_ref("as an explicit call type argument")?);
                  if self.consume(TokenKind::Comma).is_none() {
                      break;
                  }
                  if self.at(TokenKind::Greater) {
                      break;
                  }
              }
              self.expect(TokenKind::Greater, "to close explicit call type arguments")?;
              Some(arguments)
          }

          fn parse_call_expression(
              &mut self,
              callee: Expression,
              type_arguments: Vec<TypeRef>,
          ) -> Option<Expression> {
              self.expect(TokenKind::LeftParen, "to start the argument list")?;
          ''')

          replace("crates/nova-parser/src/parser.rs", '''
          kind: ExpressionKind::Call {
              callee: Box::new(callee),
              arguments,
          },
          ''', '''
          kind: ExpressionKind::Call {
              callee: Box::new(callee),
              type_arguments,
              arguments,
          },
          ''')

          replace("crates/nova-sema/src/numeric_surface.rs", '''
          ExpressionKind::Call { callee, arguments } => {
              rewrite_expression(callee);
          ''', '''
          ExpressionKind::Call {
              callee, arguments, ..
          } => {
              rewrite_expression(callee);
          ''')

          replace("crates/nova-sema/src/analyzer.rs", '''
          ast::ExpressionKind::Call { callee, arguments } => {
              let call_entry_state = self.capture_reachable_state();
              let callee = self.lower_expression(callee, return_type);
          ''', '''
          ast::ExpressionKind::Call {
              callee,
              type_arguments,
              arguments,
          } => {
              let call_entry_state = self.capture_reachable_state();
              let callee = self.lower_expression(callee, return_type);
              let explicit_type_arguments = type_arguments
                  .iter()
                  .map(|argument| self.resolve_type_ref(argument))
                  .collect::<Vec<_>>();
          ''')

          replace("crates/nova-sema/src/analyzer.rs", '''
          let ty = self.check_call(&callee, &lowered_arguments, expression.span);
          ''', '''
          let ty = self.check_call(
              &callee,
              &explicit_type_arguments,
              &lowered_arguments,
              expression.span,
          );
          ''')

          replace("crates/nova-sema/src/analyzer.rs", '''
          fn check_call(
              &mut self,
              callee: &hir::Expression,
              arguments: &[hir::Expression],
              span: Span,
          ) -> Type {
          ''', '''
          fn check_call(
              &mut self,
              callee: &hir::Expression,
              explicit_type_arguments: &[Type],
              arguments: &[hir::Expression],
              span: Span,
          ) -> Type {
          ''')

          replace("crates/nova-sema/src/analyzer.rs", '''
          let generic_set = generic_parameters.iter().cloned().collect::<BTreeSet<_>>();

          let arity_matches = arguments.len() == signature.parameters.len();
          ''', '''
          let generic_set = generic_parameters.iter().cloned().collect::<BTreeSet<_>>();
          let explicit_arity_matches = explicit_type_arguments.is_empty()
              || explicit_type_arguments.len() == generic_parameters.len();
          if !explicit_arity_matches {
              self.diagnostics.push(
                  Diagnostic::error("N3039", "wrong number of generic type arguments").with_primary(
                      span,
                      format!(
                          "expected {} type argument(s), found {}",
                          generic_parameters.len(),
                          explicit_type_arguments.len()
                      ),
                  ),
              );
          }

          let arity_matches = arguments.len() == signature.parameters.len();
          ''')

          replace("crates/nova-sema/src/analyzer.rs", '''
          let mut substitutions = BTreeMap::new();
          let mut argument_types_match = true;
          ''', '''
          let mut substitutions = BTreeMap::new();
          if explicit_arity_matches && !explicit_type_arguments.is_empty() {
              for (name, ty) in generic_parameters.iter().zip(explicit_type_arguments) {
                  substitutions.insert(name.clone(), ty.clone());
              }
          }
          let mut argument_types_match = explicit_arity_matches;
          ''')

          replace("crates/nova-sema/src/analyzer.rs", '''
          .with_note(
              "explicit type arguments are not implemented in this bootstrap slice",
          ),
          ''', '''
          .with_note("provide explicit call type arguments, for example `function<Int>(...)`"),
          ''')
          PY

          cargo fmt --all
          git add crates/nova-parser/src/ast.rs crates/nova-parser/src/parser.rs crates/nova-sema/src/analyzer.rs crates/nova-sema/src/numeric_surface.rs
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git commit -m "feat: add explicit generic call type arguments"
          git push origin HEAD:conquest/bil-37-explicit-generic-arguments

          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo doc --workspace --no-deps
