name: BIL-37 implementation
on:
  push:
    branches: [conquest/bil-37-explicit-generic-arguments]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply AST change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/nova-parser/src/ast.rs')
          s = p.read_text()
          old = "    Call {\n        /// Expression producing the callee.\n        callee: Box<Expression>,\n        /// Arguments in source order.\n        arguments: Vec<Expression>,\n    },"
          new = "    Call {\n        /// Expression producing the callee.\n        callee: Box<Expression>,\n        /// Explicit call-site type arguments in source order.\n        type_arguments: Vec<TypeRef>,\n        /// Value arguments in source order.\n        arguments: Vec<Expression>,\n    },"
          if old not in s:
              raise SystemExit('AST call anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add crates/nova-parser/src/ast.rs
          git commit -m 'feat: represent explicit generic call arguments'
          git push origin HEAD:conquest/bil-37-explicit-generic-arguments
