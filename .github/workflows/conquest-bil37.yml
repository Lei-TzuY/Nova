name: BIL-37 diagnostics

on:
  push:
    branches:
      - conquest/bil-37-explicit-generic-arguments

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture workspace check
        run: |
          set +e
          cargo check --workspace --all-targets > .github/bil37_build.log 2>&1
          status=$?
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add .github/bil37_build.log
          git commit -m "chore: capture BIL-37 compile diagnostics"
          git push origin HEAD:conquest/bil-37-explicit-generic-arguments
          exit $status
