name: Runtime nominal type identity docs

on:
  push:
    branches:
      - fix/runtime-nominal-type-identity
    paths:
      - .github/runtime-nominal-type-identity-docs.py
      - .github/workflows/runtime-nominal-type-identity-docs.yml

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-nominal-type-identity
      - name: Apply runtime nominal type identity docs
        run: |
          python .github/runtime-nominal-type-identity-docs.py
          rm .github/runtime-nominal-type-identity-docs.py
          rm .github/workflows/runtime-nominal-type-identity-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close runtime nominal type identity slice"
          git push origin HEAD:fix/runtime-nominal-type-identity
