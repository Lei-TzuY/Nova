name: PR166 mechanical fixer

on:
  push:
    branches:
      - feat/closures-lexical-capture

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/closures-lexical-capture
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply mechanical CI fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/nova-sema/src/analyzer.rs')
          text = p.read_text()
          dead = '''    fn find_local(&self, name: &str) -> Option<LocalSymbol> {\n        self.find_local_with_scope(name).map(|(_, symbol)| symbol)\n    }\n\n'''
          if text.count(dead) != 1:
              raise SystemExit('expected exactly one unused find_local helper')
          p.write_text(text.replace(dead, '', 1))
          PY
          cargo fmt --all
          git rm .github/workflows/fix-pr166.yml
          git diff --check
      - name: Commit mechanical fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply CI formatting fixes"
          git push origin HEAD:feat/closures-lexical-capture
