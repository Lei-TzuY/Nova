name: Function equality legacy test fix

on:
  push:
    branches:
      - feat/function-identity-equality

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/function-identity-equality
      - name: Update legacy equality regression
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('crates/nova-sema/src/analyzer.rs')
          text = path.read_text()
          pattern = re.compile(
              r'(fn equality_accepts_only_matching_primitive_types\(\) \{.*?)(assert_eq!\(codes\(&output\), vec!\["N3004"\]\);)(\n\s*\})',
              re.S,
          )
          replacement = (
              r'fn equality_accepts_matching_primitives_and_function_signatures() {'
              r'\g<1>'.split('fn equality_accepts_only_matching_primitive_types() {', 1)[-1]
          )
          match = pattern.search(text)
          if match is None:
              raise SystemExit('legacy equality test function not found')
          body = match.group(1).replace(
              'fn equality_accepts_only_matching_primitive_types() {',
              'fn equality_accepts_matching_primitives_and_function_signatures() {',
              1,
          )
          updated = body + 'assert!(output.is_success(), "{:?}", output.diagnostics);' + match.group(3)
          path.write_text(text[:match.start()] + updated + text[match.end():])
          PY
          cargo fmt --all
          rm .github/workflows/function-equality-testfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: update function equality expectation"
          git push origin HEAD:feat/function-identity-equality
