name: Finalize complete invalid while backedge docs

on:
  push:
    branches: [fix/invalid-while-continue-backedge]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Broaden documentation to all rejected-loop backedges
        run: python scripts/broaden-invalid-while-backedge-docs.py

      - name: Validate focused regressions
        run: |
          cargo fmt --all -- --check
          cargo test -p nova-sema --test invalid_while_continue_flow --locked

      - name: Commit docs and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/broaden-invalid-while-backedge-docs.yml
          rm scripts/broaden-invalid-while-backedge-docs.py
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add -A
          git commit -m 'docs: cover all rejected while backedges'
          git push origin HEAD:fix/invalid-while-continue-backedge
