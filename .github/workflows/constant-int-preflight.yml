name: Validate constant Int preflight

on:
  push:
    branches:
      - feat/constant-int-preflight

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile new regression target
        run: cargo test -p nova-sema --test constant_integer_failures --locked --no-run
      - name: Confirm constant failure regression is red
        shell: bash
        run: |
          set -euo pipefail
          if cargo test -p nova-sema --test constant_integer_failures --locked; then
            echo "constant arithmetic regression unexpectedly passed before the production patch" >&2
            exit 1
          fi
      - name: Apply constant Int preflight
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_constant_int_preflight.py
          python scripts/apply_constant_int_reachability.py
      - name: Validate semantic and runtime boundaries
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Commit fix and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/constant-int-preflight.yml scripts/apply_constant_int_preflight.py scripts/apply_constant_int_reachability.py
          git add -A
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git commit -m "feat: preflight constant Int failures"
          git push origin HEAD:feat/constant-int-preflight
