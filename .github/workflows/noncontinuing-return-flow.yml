name: Validate noncontinuing return flow

on:
  push:
    branches: [fix/noncontinuing-return-expression]

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Compile return-flow regression target
        run: cargo test -p nova-sema --test noncontinuing_return_expression --locked --no-run

      - name: Confirm parent-return regression is red
        shell: bash
        run: |
          set -euo pipefail
          if cargo test -p nova-sema --test noncontinuing_return_expression --locked; then
            echo "expected noncontinuing return-expression regressions to fail before the fix" >&2
            exit 1
          fi

      - name: Apply return-flow fix
        run: python scripts/apply-noncontinuing-return-flow.py

      - name: Validate behavior
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test -p nova-sema --test noncontinuing_return_expression --locked
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo build --workspace --all-targets --locked
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked

      - name: Commit implementation and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/noncontinuing-return-flow.yml
          rm scripts/apply-noncontinuing-return-flow.py
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve child transfer precedence in return expressions'
          git push origin HEAD:fix/noncontinuing-return-expression
