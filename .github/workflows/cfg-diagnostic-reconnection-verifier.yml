name: Validate CFG diagnostic reconnection verifier

on:
  push:
    branches: [fix/cfg-diagnostic-reconnection-verifier]

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Add verifier regression
        run: python scripts/add-cfg-diagnostic-reconnection-regression.py

      - name: Compile regression target
        run: cargo test -p nova-sema verifier_rejects_diagnostic_only_reconnection --locked --no-run

      - name: Confirm verifier regression is red
        shell: bash
        run: |
          set -euo pipefail
          if cargo test -p nova-sema verifier_rejects_diagnostic_only_reconnection --locked; then
            echo "expected diagnostic-reconnection verifier regression to fail before the fix" >&2
            exit 1
          fi

      - name: Apply verifier invariant
        run: python scripts/apply-cfg-diagnostic-reconnection-verifier.py

      - name: Validate behavior
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test -p nova-sema verifier_rejects_diagnostic_only_reconnection --locked
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo build --workspace --all-targets --locked
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked

      - name: Commit implementation and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/cfg-diagnostic-reconnection-verifier.yml
          rm scripts/add-cfg-diagnostic-reconnection-regression.py
          rm scripts/apply-cfg-diagnostic-reconnection-verifier.py
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add -A
          git commit -m 'fix: verify diagnostic CFG isolation'
          git push origin HEAD:fix/cfg-diagnostic-reconnection-verifier
