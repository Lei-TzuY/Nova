                              '''function_decl       = "fn" , identifier , [ type_parameters ] , "(" , [ parameters ] , ")" , "->" , type_ref , block ;\ntype_parameters     = "<" , identifier , { "," , identifier } , [ "," ] , ">" ;''')
          p.write_text(text)

          # Remove this implementation helper from the candidate diff.
          Path('.github/workflows/conquest-bil34.yml').unlink()
