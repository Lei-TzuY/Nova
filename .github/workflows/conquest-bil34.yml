name: Conquest BIL-34

on:
  push:
    branches:
      - conquest/bil-34-generic-functions

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[bil34-error]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/bil-34-generic-functions
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Align grammar source shape
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/grammar.md')
          text = p.read_text()
          old = '''function            = "fn" , identifier , "(" , [ parameters ] , ")" ,
                                "->" , type_ref , block ;'''
          new = 'function_decl       = "fn" , identifier , "(" , [ parameters ] , ")" , "->" , type_ref , block ;'
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace('declaration         = record_declaration | enum_declaration | function ;', 'declaration         = record_declaration | enum_declaration | function_decl ;', 1)
          p.write_text(text)
          PY
      - name: Apply implementation
        run: |
          if ! python .github/bil34_impl.py > /tmp/bil34.log 2>&1; then
            cat /tmp/bil34.log
            cp /tmp/bil34.log .github/bil34-error.txt
            git config user.name LeiZ
            git config user.email 52287354+Lei-TzuY@users.noreply.github.com
            git add .github/bil34-error.txt
            git commit -m "chore: capture BIL-34 patch error [bil34-error]"
            git push origin HEAD:conquest/bil-34-generic-functions
            exit 1
          fi
          rm -f .github/bil34-error.txt
      - name: Complete inspection fail-closed handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/nova-inspect/src/lib.rs')
          text = p.read_text()
          old = '''                    Type::Bool => (v1::TypeKind::Bool, None, Vec::new(), None),
                              Type::String => (v1::TypeKind::String, None, Vec::new(), None),'''
          new = '''                    Type::Bool => (v1::TypeKind::Bool, None, Vec::new(), None),
                              Type::TypeParameter(name) => {
                                  return Err(InspectionError::invalid(format!(
                                      "semantic-inspection schema v1-v8 cannot encode generic type parameter `{name}`"
                                  )));
                              }
                              Type::String => (v1::TypeKind::String, None, Vec::new(), None),'''
          assert old in text
          p.write_text(text.replace(old, new, 1))
          PY
      - run: cargo fmt --all
      - name: Compile candidate
        run: |
          if ! cargo check --workspace --all-targets --locked > /tmp/bil34-check.log 2>&1; then
            cat /tmp/bil34-check.log
            cp /tmp/bil34-check.log .github/bil34-error.txt
            git config user.name LeiZ
            git config user.email 52287354+Lei-TzuY@users.noreply.github.com
            git add .github/bil34-error.txt
            git commit -m "chore: capture BIL-34 compile error [bil34-error]"
            git push origin HEAD:conquest/bil-34-generic-functions
            exit 1
          fi
      - name: Commit implementation
        run: |
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "feat: add inferred generic functions"
          git push origin HEAD:conquest/bil-34-generic-functions
