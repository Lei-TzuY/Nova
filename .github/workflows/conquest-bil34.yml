name: Conquest BIL-34

on:
  push:
    branches:
      - conquest/bil-34-generic-functions

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[bil34-error]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/bil-34-generic-functions
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply implementation
        run: |
          if ! python .github/bil34_impl.py > /tmp/bil34.log 2>&1; then
            cat /tmp/bil34.log
            cp /tmp/bil34.log .github/bil34-error.txt
            git config user.name LeiZ
            git config user.email 52287354+Lei-TzuY@users.noreply.github.com
            git add .github/bil34-error.txt
            git commit -m "chore: capture BIL-34 patch error [bil34-error]"
            git push origin HEAD:conquest/bil-34-generic-functions
            exit 1
          fi
      - run: cargo fmt --all
      - run: cargo check --workspace --all-targets --locked
      - name: Commit implementation
        run: |
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "feat: add inferred generic functions"
          git push origin HEAD:conquest/bil-34-generic-functions
