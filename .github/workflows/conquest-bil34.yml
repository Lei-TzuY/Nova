name: Conquest BIL-34

on:
  push:
    branches: [conquest/bil-34-generic-functions]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/bil-34-generic-functions
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Implement generic function inference
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              assert found == count, f"{path}: expected {count} matches, found {found}"
              p.write_text(text.replace(old, new, count))

          # AST: generic parameters belong to top-level functions.
          replace('crates/nova-parser/src/ast.rs',
          '''    /// Declared function name.\n    pub name: Name,\n    /// Explicitly typed parameters.\n    pub parameters: Vec<Parameter>,''',
          '''    /// Declared function name.\n    pub name: Name,\n    /// Declared generic type parameters in source order.\n    pub type_parameters: Vec<Name>,\n    /// Explicitly typed parameters.\n    pub parameters: Vec<Parameter>,''')

          # Parser: accept fn name<T, U>(...). Existing comparison tokens make this unambiguous here.
          replace('crates/nova-parser/src/parser.rs',
          '''        let name = self.parse_name("after `fn`")?;\n        self.expect(TokenKind::LeftParen, "after the function name")?;\n        let parameters = self.parse_parameters()?;''',
          '''        let name = self.parse_name("after `fn`")?;\n        let type_parameters = self.parse_type_parameters()?;\n        self.expect(TokenKind::LeftParen, "after the function name or type parameters")?;\n        let parameters = self.parse_parameters()?;''')
          replace('crates/nova-parser/src/parser.rs',
          '''        Some(Function {\n            name,\n            parameters,''',
          '''        Some(Function {\n            name,\n            type_parameters,\n            parameters,''')
          marker = '''    fn parse_parameters(&mut self) -> Option<Vec<Parameter>> {'''
          p = Path('crates/nova-parser/src/parser.rs')
          text = p.read_text()
          assert text.count(marker) == 1
          helper = '''    fn parse_type_parameters(&mut self) -> Option<Vec<Name>> {\n        if self.consume(TokenKind::Less).is_none() {\n            return Some(Vec::new());\n        }\n        let mut parameters = Vec::new();\n        if self.at(TokenKind::Greater) {\n            self.diagnostics.push(\n                Diagnostic::error("N2001", "expected a type parameter")\n                    .with_primary(self.current().span, "a generic function must declare at least one type parameter"),\n            );\n        } else {\n            loop {\n                parameters.push(self.parse_name("as a type parameter")?);\n                if self.consume(TokenKind::Comma).is_none() {\n                    break;\n                }\n                if self.at(TokenKind::Greater) {\n                    break;\n                }\n            }\n        }\n        self.expect(TokenKind::Greater, "to close the type parameter list")?;\n        Some(parameters)\n    }\n\n'''
          p.write_text(text.replace(marker, helper + marker, 1))

          # HIR type parameter and declaration metadata.
          replace('crates/nova-sema/src/hir.rs',
          '''    /// Boolean type.\n    Bool,''',
          '''    /// Boolean type.\n    Bool,\n    /// Rigid function-scoped generic type parameter.\n    TypeParameter(String),''')
          replace('crates/nova-sema/src/hir.rs',
          '''            Self::Bool => formatter.write_str("Bool"),\n            Self::String => formatter.write_str("String"),''',
          '''            Self::Bool => formatter.write_str("Bool"),\n            Self::TypeParameter(name) => formatter.write_str(name),\n            Self::String => formatter.write_str("String"),''')
          replace('crates/nova-sema/src/hir.rs',
          '''    /// Declared spelling.\n    pub name: String,\n    /// Parameters, each represented as a local binding.''',
          '''    /// Declared spelling.\n    pub name: String,\n    /// Generic type parameter names in declaration order.\n    pub type_parameters: Vec<String>,\n    /// Parameters, each represented as a local binding.''')

          # Analyzer signature metadata.
          replace('crates/nova-sema/src/analyzer.rs',
          '''struct SignatureRecord {\n    parameters: Vec<Type>,\n    return_type: Type,\n}''',
          '''struct SignatureRecord {\n    type_parameters: Vec<String>,\n    parameters: Vec<Type>,\n    return_type: Type,\n}''')

          # Resolve function signatures in a function-scoped type-parameter namespace.
          old = '''    fn collect_function_signatures(&mut self, program: &ast::Program) {\n        for (index, function) in program.functions.iter().enumerate() {\n            let id = FunctionId::in_module(self.module.id, index);\n            let parameters = function\n                .parameters\n                .iter()\n                .map(|parameter| self.resolve_type_ref(&parameter.ty))\n                .collect::<Vec<_>>();\n            let return_type = self.resolve_type_ref(&function.return_type);\n            let record = SignatureRecord {\n                parameters,\n                return_type,\n            };'''
          new = '''    fn collect_function_signatures(&mut self, program: &ast::Program) {\n        for (index, function) in program.functions.iter().enumerate() {\n            let id = FunctionId::in_module(self.module.id, index);\n            let mut type_parameters = BTreeSet::new();\n            let mut ordered_type_parameters = Vec::with_capacity(function.type_parameters.len());\n            for parameter in &function.type_parameters {\n                let reserved = matches!(parameter.text.as_str(), "Int" | "UInt" | "Bool" | "String" | "Unit")\n                    || self.module.types.contains_key(&parameter.text);\n                if reserved {\n                    self.diagnostics.push(\n                        Diagnostic::error("N3036", "invalid generic type parameter").with_primary(\n                            parameter.span,\n                            format!("type parameter `{}` conflicts with an existing type name", parameter.text),\n                        ),\n                    );\n                } else if !type_parameters.insert(parameter.text.clone()) {\n                    self.diagnostics.push(\n                        Diagnostic::error("N3036", "duplicate generic type parameter").with_primary(\n                            parameter.span,\n                            format!("type parameter `{}` is declared more than once", parameter.text),\n                        ),\n                    );\n                } else {\n                    ordered_type_parameters.push(parameter.text.clone());\n                }\n            }\n            let parameters = function\n                .parameters\n                .iter()\n                .map(|parameter| self.resolve_type_ref_with_parameters(&parameter.ty, &type_parameters))\n                .collect::<Vec<_>>();\n            let return_type = self.resolve_type_ref_with_parameters(&function.return_type, &type_parameters);\n            let record = SignatureRecord {\n                type_parameters: ordered_type_parameters,\n                parameters,\n                return_type,\n            };'''
          replace('crates/nova-sema/src/analyzer.rs', old, new)

          # Split ordinary type resolution from generic-aware resolution.
          old = '''    fn resolve_type_ref(&mut self, reference: &ast::TypeRef) -> Type {\n        match &reference.kind {'''
          new = '''    fn resolve_type_ref(&mut self, reference: &ast::TypeRef) -> Type {\n        self.resolve_type_ref_with_parameters(reference, &BTreeSet::new())\n    }\n\n    fn resolve_type_ref_with_parameters(\n        &mut self,\n        reference: &ast::TypeRef,\n        type_parameters: &BTreeSet<String>,\n    ) -> Type {\n        match &reference.kind {'''
          replace('crates/nova-sema/src/analyzer.rs', old, new)
          replace('crates/nova-sema/src/analyzer.rs',
          '''            ast::TypeRefKind::Named(name) => match name.text.as_str() {\n                "Int" => Type::Int,''',
          '''            ast::TypeRefKind::Named(name) if type_parameters.contains(&name.text) => {\n                Type::TypeParameter(name.text.clone())\n            }\n            ast::TypeRefKind::Named(name) => match name.text.as_str() {\n                "Int" => Type::Int,''')
          replace('crates/nova-sema/src/analyzer.rs',
          '''                    .map(|parameter| self.resolve_type_ref(parameter))\n                    .collect(),\n                return_type: Box::new(self.resolve_type_ref(return_type)),''',
          '''                    .map(|parameter| self.resolve_type_ref_with_parameters(parameter, type_parameters))\n                    .collect(),\n                return_type: Box::new(self.resolve_type_ref_with_parameters(return_type, type_parameters)),''')
          replace('crates/nova-sema/src/analyzer.rs',
          '''            name: function.name.text.clone(),\n            parameters,''',
          '''            name: function.name.text.clone(),\n            type_parameters: signature.type_parameters,\n            parameters,''')

          # Generic call inference. Direct generic top-level function references carry rigid T in the HIR signature.
          old_start = text = Path('crates/nova-sema/src/analyzer.rs').read_text()
          start = text.index('    fn check_call(\n')
          end = text.index('    fn join_branch_types(\n', start)
          replacement = r'''    fn infer_generic_argument(
        &mut self,
        actual: &Type,
        expected: &Type,
        type_parameters: &BTreeSet<String>,
        substitutions: &mut BTreeMap<String, Type>,
        span: Span,
    ) -> bool {
        if actual.is_error() || actual.is_never() {
            return true;
        }
        match expected {
            Type::TypeParameter(name) if type_parameters.contains(name) => {
                if let Some(previous) = substitutions.get(name) {
                    if previous != actual {
                        self.diagnostics.push(
                            Diagnostic::error("N3037", "conflicting generic type inference")
                                .with_primary(
                                    span,
                                    format!("type parameter `{name}` was inferred as both {previous} and {actual}"),
                                ),
                        );
                        return false;
                    }
                } else {
                    substitutions.insert(name.clone(), actual.clone());
                }
                true
            }
            Type::Function(expected_fn) => {
                let Type::Function(actual_fn) = actual else { return false; };
                if actual_fn.parameters.len() != expected_fn.parameters.len() { return false; }
                actual_fn.parameters.iter().zip(&expected_fn.parameters).all(|(a, e)| {
                    self.infer_generic_argument(a, e, type_parameters, substitutions, span)
                }) && self.infer_generic_argument(
                    &actual_fn.return_type,
                    &expected_fn.return_type,
                    type_parameters,
                    substitutions,
                    span,
                )
            }
            _ => expected_type_compatible(actual, expected),
        }
    }

    fn substitute_generic_type(
        ty: &Type,
        substitutions: &BTreeMap<String, Type>,
    ) -> Option<Type> {
        match ty {
            Type::TypeParameter(name) => substitutions.get(name).cloned(),
            Type::Function(signature) => Some(Type::Function(FunctionType {
                parameters: signature
                    .parameters
                    .iter()
                    .map(|ty| Self::substitute_generic_type(ty, substitutions))
                    .collect::<Option<Vec<_>>>()?,
                return_type: Box::new(Self::substitute_generic_type(
                    &signature.return_type,
                    substitutions,
                )?),
            })),
            other => Some(other.clone()),
        }
    }

    fn check_call(
        &mut self,
        callee: &hir::Expression,
        arguments: &[hir::Expression],
        span: Span,
    ) -> Type {
        if callee.ty.is_never() {
            return Type::Never;
        }

        let arguments_never = arguments.iter().any(|argument| argument.ty.is_never());
        let arguments_error = arguments.iter().any(|argument| argument.ty.is_error());
        let Type::Function(signature) = callee.ty.clone() else {
            if callee.ty.is_error() {
                return if arguments_never { Type::Never } else { Type::Error };
            }
            self.diagnostics.push(
                Diagnostic::error("N3005", "expression is not callable").with_primary(
                    callee.span,
                    format!("found {} instead of a function", callee.ty),
                ),
            );
            return if arguments_never { Type::Never } else { Type::Error };
        };

        let generic_parameters = match &callee.kind {
            ExpressionKind::Function { function, .. } => self
                .signatures
                .get(function.index())
                .map(|record| record.type_parameters.clone())
                .unwrap_or_default(),
            _ => Vec::new(),
        };
        let generic_set = generic_parameters.iter().cloned().collect::<BTreeSet<_>>();

        let arity_matches = arguments.len() == signature.parameters.len();
        if !arity_matches {
            self.diagnostics.push(
                Diagnostic::error("N3006", "wrong number of arguments").with_primary(
                    span,
                    format!(
                        "expected {} argument(s), found {}",
                        signature.parameters.len(),
                        arguments.len()
                    ),
                ),
            );
        }

        let mut substitutions = BTreeMap::new();
        let mut argument_types_match = true;
        for (index, (argument, expected)) in arguments
            .iter()
            .zip(signature.parameters.iter())
            .enumerate()
        {
            if generic_set.is_empty() {
                let type_matches = expected_type_compatible(&argument.ty, expected);
                self.require_type(
                    &argument.ty,
                    expected,
                    argument.span,
                    &format!("argument {}", index + 1),
                );
                argument_types_match &= type_matches;
            } else if !self.infer_generic_argument(
                &argument.ty,
                expected,
                &generic_set,
                &mut substitutions,
                argument.span,
            ) {
                if !argument.ty.is_error() && !argument.ty.is_never() {
                    self.diagnostics.push(
                        Diagnostic::error("N3004", "type mismatch").with_primary(
                            argument.span,
                            format!("argument {} does not match generic parameter type {expected}", index + 1),
                        ),
                    );
                }
                argument_types_match = false;
            }
        }

        let missing = generic_parameters
            .iter()
            .filter(|name| !substitutions.contains_key(*name))
            .cloned()
            .collect::<Vec<_>>();
        if !missing.is_empty() && !arguments_never && !arguments_error && arity_matches {
            self.diagnostics.push(
                Diagnostic::error("N3038", "cannot infer generic type parameter")
                    .with_primary(
                        span,
                        format!("cannot infer type parameter(s): {}", missing.join(", ")),
                    )
                    .with_note("explicit type arguments are not implemented in this bootstrap slice"),
            );
            argument_types_match = false;
        }

        if arguments_never {
            Type::Never
        } else if arguments_error || !arity_matches || !argument_types_match {
            Type::Error
        } else if generic_set.is_empty() {
            *signature.return_type
        } else {
            Self::substitute_generic_type(&signature.return_type, &substitutions)
                .unwrap_or(Type::Error)
        }
    }

'''
          p = Path('crates/nova-sema/src/analyzer.rs')
          p.write_text(text[:start] + replacement + text[end:])

          # Equality on unconstrained T is intentionally unavailable in this slice.
          replace('crates/nova-sema/src/equality_rules.rs',
          '''        Type::Record(_) | Type::Never | Type::Error => false,''',
          '''        Type::Record(_) | Type::TypeParameter(_) | Type::Never | Type::Error => false,''')

          # Constant-value proofs cannot reason about an unconstrained generic parameter.
          p = Path('crates/nova-sema/src/constant_condition.rs')
          text = p.read_text()
          text = text.replace('''        Type::UInt => Ok(false),\n        Type::Bool =>''', '''        Type::UInt | Type::TypeParameter(_) => Ok(false),\n        Type::Bool =>''')
          p.write_text(text)

          # Runtime keeps an instantiation stack so rigid T remains checked inside the generic body.
          replace('crates/nova-interpreter/src/lib.rs',
          '''    shared_cells: Vec<Option<Value>>,\n}''',
          '''    shared_cells: Vec<Option<Value>>,\n    type_argument_stack: Vec<BTreeMap<String, Type>>,\n}''')
          replace('crates/nova-interpreter/src/lib.rs',
          '''            shared_cells: Vec::new(),\n        }''',
          '''            shared_cells: Vec::new(),\n            type_argument_stack: Vec::new(),\n        }''')

          p = Path('crates/nova-interpreter/src/lib.rs')
          text = p.read_text()
          start = text.index('    fn call_function(\n')
          end = text.index('    fn call_closure(\n', start)
          replacement = r'''    fn concrete_type_of_value(&self, value: &Value) -> Option<Type> {
        match value {
            Value::Int(_) => Some(Type::Int),
            Value::UInt(_) => Some(Type::UInt),
            Value::Bool(_) => Some(Type::Bool),
            Value::String(_) => Some(Type::String),
            Value::Unit => Some(Type::Unit),
            Value::Record { record, .. } => self.program.records.get(record.index()).and_then(|definition| {
                (definition.id == *record).then(|| Type::Record(nova_sema::hir::RecordType {
                    id: *record,
                    name: definition.name.clone(),
                }))
            }),
            Value::Enum { enumeration, .. } => self.program.enums.get(enumeration.index()).and_then(|definition| {
                (definition.id == *enumeration).then(|| Type::Enum(nova_sema::hir::EnumType {
                    id: *enumeration,
                    name: definition.name.clone(),
                }))
            }),
            Value::Function(id) => self.program.functions.get(id.index()).and_then(|function| {
                (function.id == *id).then(|| Type::Function(nova_sema::hir::FunctionType {
                    parameters: function.parameters.iter().map(|parameter| parameter.ty.clone()).collect(),
                    return_type: Box::new(function.return_type.clone()),
                }))
            }),
            Value::Closure { closure, .. } => Some(Type::Function(closure.function_type())),
        }
    }

    fn bind_runtime_generic(
        &self,
        pattern: &Type,
        value: &Value,
        generic_names: &BTreeSet<String>,
        substitutions: &mut BTreeMap<String, Type>,
    ) -> bool {
        match pattern {
            Type::TypeParameter(name) if generic_names.contains(name) => {
                let Some(actual) = self.concrete_type_of_value(value) else { return false; };
                match substitutions.get(name) {
                    Some(previous) => previous == &actual,
                    None => { substitutions.insert(name.clone(), actual); true }
                }
            }
            _ => self.value_conforms_to_type(value, pattern),
        }
    }

    fn call_function(
        &mut self,
        function_id: FunctionId,
        arguments: Vec<Value>,
    ) -> Result<Value, Diagnostic> {
        if function_id.module() != self.program.module.id {
            return Err(self.invariant(
                self.program.span,
                format!(
                    "resolved function belongs to module {}, but this program is module {}",
                    function_id.module().raw(),
                    self.program.module.id.raw()
                ),
            ));
        }
        let Some(function) = self.program.functions.get(function_id.index()).cloned() else {
            return Err(self.invariant(
                self.program.span,
                format!("resolved function id {} is outside the program", function_id.index()),
            ));
        };
        if function.id != function_id {
            return Err(self.invariant(function.span, "function declaration index does not match its resolved identity"));
        }
        if function.parameters.len() != arguments.len() {
            return Err(self.invariant(
                function.span,
                format!(
                    "resolved call supplied {} argument(s) to {} parameter(s)",
                    arguments.len(), function.parameters.len()
                ),
            ));
        }

        let generic_names = function.type_parameters.iter().cloned().collect::<BTreeSet<_>>();
        let mut substitutions = BTreeMap::new();
        for (parameter, argument) in function.parameters.iter().zip(&arguments) {
            if !self.bind_runtime_generic(&parameter.ty, argument, &generic_names, &mut substitutions) {
                return Err(self.invariant(
                    function.span,
                    format!("runtime generic instantiation does not satisfy parameter `{}` type {}", parameter.name, parameter.ty),
                ));
            }
        }
        if function.type_parameters.iter().any(|name| !substitutions.contains_key(name)) {
            return Err(self.invariant(function.span, "runtime generic call is missing an inferred type argument"));
        }
        self.type_argument_stack.push(substitutions);
        let result = (|| -> Result<Value, Diagnostic> {
            for (index, (parameter, argument)) in function.parameters.iter().zip(&arguments).enumerate() {
                if !self.value_conforms_to_type(argument, &parameter.ty) {
                    return Err(self.invariant(
                        function.span,
                        format!(
                            "argument {index} for parameter `{}` of function `{}` does not conform to instantiated runtime type {}",
                            parameter.name, function.name, parameter.ty
                        ),
                    ));
                }
            }
            if self.call_depth >= MAX_CALL_DEPTH {
                return Err(
                    Diagnostic::error("N4004", "execution call-depth limit exceeded")
                        .with_primary(
                            function.span,
                            format!("the bootstrap interpreter allows at most {MAX_CALL_DEPTH} active function calls"),
                        )
                        .with_note("this guard prevents uncontrolled host-stack recursion"),
                );
            }
            let mut frame = Frame::new();
            for (parameter, argument) in function.parameters.iter().zip(arguments) {
                self.bind_runtime_slot(&mut frame, parameter, Some(argument), function.span)?;
            }
            self.call_depth += 1;
            let evaluated = self.eval_function(&function, &mut frame);
            self.call_depth -= 1;
            let value = evaluated?;
            if !self.value_conforms_to_type(&value, &function.return_type) {
                return Err(self.invariant(
                    function.span,
                    format!(
                        "function `{}` returned a runtime value that does not conform to instantiated type {}",
                        function.name, function.return_type
                    ),
                ));
            }
            Ok(value)
        })();
        self.type_argument_stack.pop();
        result
    }

