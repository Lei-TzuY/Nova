name: Fix and validate literal match tests

on:
  push:
    branches:
      - feat/literal-match-dataflow

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/literal-match-dataflow
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix generated test continuations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/nova-sema/src/analyzer.rs")
          text = path.read_text()
          old = "\\n\\\\\n"
          new = "\\n\\\n"
          count = text.count(old)
          if count != 30:
              raise SystemExit(f"expected 30 generated continuations, found {count}")
          path.write_text(text.replace(old, new))
          PY
          cargo fmt --all
          cargo test -p nova-sema --lib --locked
      - name: Commit validated fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/literal-match-test-fix.yml
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "test: validate literal match reachability"
          git push origin HEAD:feat/literal-match-dataflow
