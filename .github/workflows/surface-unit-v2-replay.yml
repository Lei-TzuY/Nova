name: Replay surface Unit on latest main

on:
  push:
    branches:
      - feat/surface-unit-v2

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/surface-unit-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Replay Unit slice without overwriting reachable-state refactor
        shell: bash
        run: |
          git fetch origin feat/surface-unit
          git checkout origin/feat/surface-unit -- \
            README.md \
            crates/nova-cli/tests/cli.rs \
            crates/nova-cli/tests/fixtures/invalid/unit-type-mismatch.nv \
            crates/nova-cli/tests/fixtures/runtime/unit-main.nv \
            crates/nova-cli/tests/fixtures/valid/unit.nv \
            crates/nova-interpreter/src/lib.rs \
            crates/nova-parser/src/ast.rs \
            crates/nova-parser/src/parser.rs \
            crates/nova-sema/src/hir.rs \
            docs/grammar.md \
            docs/language-constitution.md

          cat > crates/nova-cli/tests/fixtures/valid/unit.nv <<'EOF'
          record UnitBox {
              value: Unit,
          }

          enum MaybeUnit {
              Empty,
              Value(Unit),
          }

          fn noop() -> Unit {
          }

          fn explicit() -> Unit {
              return ();
          }

          fn pass(value: Unit) -> Unit {
              value
          }

          fn main() -> Int {
              noop();
              let marker: Unit = pass(explicit());
              let boxed = new UnitBox { value: marker };
              let wrapped = MaybeUnit::Value(boxed.value);
              match wrapped {
                  MaybeUnit::Empty => 0,
                  MaybeUnit::Value(inner) => { pass(inner); 42 },
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          def block(lines):
              return "\n".join(lines) + "\n"

          def patch(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          analyzer = "crates/nova-sema/src/analyzer.rs"
          patch(
              analyzer,
              '            if matches!(name.text.as_str(), "Int" | "Bool") {\n',
              '            if matches!(name.text.as_str(), "Int" | "Bool" | "Unit") {\n',
          )
          patch(
              analyzer,
              block([
                  '            "Int" => Type::Int,',
                  '            "Bool" => Type::Bool,',
                  '            unknown => {',
              ]),
              block([
                  '            "Int" => Type::Int,',
                  '            "Bool" => Type::Bool,',
                  '            "Unit" => Type::Unit,',
                  '            unknown => {',
              ]),
          )
          patch(
              analyzer,
              '                            "the bootstrap semantic core recognizes Int, Bool, and declared record or enum names",\n',
              '                            "the bootstrap semantic core recognizes Int, Bool, Unit, and declared record or enum names",\n',
          )
          patch(
              analyzer,
              '        if !body.ty.is_never() && function.body.tail.is_none() {\n',
              '        if !body.ty.is_never()\n            && function.body.tail.is_none()\n            && signature.return_type != Type::Unit\n        {\n',
          )
          patch(
              analyzer,
              block([
                  '            ast::ExpressionKind::Integer(value) => (ExpressionKind::Integer(*value), Type::Int),',
                  '            ast::ExpressionKind::Boolean(value) => (ExpressionKind::Boolean(*value), Type::Bool),',
                  '            ast::ExpressionKind::Name(name) => self.lower_name(name),',
              ]),
              block([
                  '            ast::ExpressionKind::Integer(value) => (ExpressionKind::Integer(*value), Type::Int),',
                  '            ast::ExpressionKind::Boolean(value) => (ExpressionKind::Boolean(*value), Type::Bool),',
                  '            ast::ExpressionKind::Unit => (ExpressionKind::Unit, Type::Unit),',
                  '            ast::ExpressionKind::Name(name) => self.lower_name(name),',
              ]),
          )

          sema_marker = block([
              '    #[test]',
              '    fn resolves_records_construction_projection_and_signatures() {',
          ])
          sema_tests = block([
              '    #[test]',
              '    fn supports_surface_unit_literals_types_and_fallthrough() {',
              '        let output = analyze_text(',
              '            "fn empty() -> Unit {} fn explicit() -> Unit { () } fn returned() -> Unit { return (); }",',
              '        );',
              '        assert!(output.is_success(), "{:?}", output.diagnostics);',
              '        assert_eq!(output.program.functions[0].return_type, Type::Unit);',
              '        assert_eq!(output.program.functions[0].body.ty, Type::Unit);',
              '        let tail = output.program.functions[1].body.tail.as_deref().expect("unit tail");',
              '        assert!(matches!(tail.kind, ExpressionKind::Unit));',
              '        assert_eq!(tail.ty, Type::Unit);',
              '    }',
              '',
              '    #[test]',
              '    fn rejects_non_unit_values_and_reserved_unit_redefinition() {',
              '        let output = analyze_text(',
              '            "record Unit { value: Int } fn bad_tail() -> Unit { 1 } fn bad_return() -> Unit { return 1; }",',
              '        );',
              '        assert_eq!(codes(&output), vec!["N3002", "N3004", "N3004"]);',
              '    }',
              '',
          ])
          patch(analyzer, sema_marker, sema_tests + sema_marker)

          roadmap = "docs/roadmap.md"
          patch(
              roadmap,
              '**Status: eleven vertical slices implemented; broader type-system work remains.**\n',
              '**Status: twelve vertical slices implemented; broader type-system work remains.**\n',
          )
          phase2_marker = block([
              'The next Phase 2 slices should address semantic depth rather than widen syntax',
              'prematurely. In particular:',
          ])
          phase2_unit = block([
              'Implemented in the twelfth Phase 2 slice:',
              '',
              '- `Unit` is promoted from an internal value-less HIR marker to a reserved surface',
              '  type available in signatures, annotations, record fields, and enum payloads;',
              '- `()` is the sole surface Unit literal and lowers to explicit typed HIR rather than',
              '  being confused with grouping or an empty argument list;',
              '- Unit-returning functions may complete through an empty body, while explicit tails',
              '  and `return` expressions remain type checked against `Unit`;',
              '- non-Unit fallthrough rules remain unchanged, and `Unit` is still excluded from the',
              '  bootstrap equality operators;',
              '- reserved-type diagnostics prevent user-defined `Unit` declarations from shadowing',
              '  the built-in type; and',
              '- parser, semantic, interpreter, CLI, aggregate, call, match, negative-type, and',
              '  invalid-entry-point coverage lock the surface contract end to end.',
              '',
          ])
          patch(roadmap, phase2_marker, phase2_unit + phase2_marker)

          patch(
              roadmap,
              '**Status: five vertical slices implemented; execution surface remains small.**\n',
              '**Status: six vertical slices implemented; execution surface remains small.**\n',
          )
          phase3_marker = block([
              'Next Phase 3 slices should deepen executable semantics without bypassing Phase 2',
              'contracts:',
          ])
          phase3_unit = block([
              'Implemented in the sixth Phase 3 slice:',
              '',
              '- the interpreter executes explicit Unit literals as the existing `Value::Unit`',
              '  runtime value and empty Unit-returning bodies produce the same value;',
              '- Unit values pass through ordinary function parameters and returns, record slots,',
              '  enum payloads, and match payload bindings without a special runtime channel;',
              '- `nova run` keeps its zero-argument `main -> Int | Bool` entry-point contract, so a',
              '  semantically valid `main() -> Unit` still fails deterministically with `N4001`; and',
              '- CLI end-to-end fixtures prove Unit execution while retaining the existing runtime',
              '  entry-point boundary.',
              '',
          ])
          patch(roadmap, phase3_marker, phase3_unit + phase3_marker)
          PY

          cargo fmt --all
          cargo test -p nova-parser -p nova-sema -p nova-interpreter --lib --locked
          cargo test -p nova-cli --test cli --locked
      - name: Commit replayed slice and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/surface-unit-v2-replay.yml
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "feat: add surface Unit semantics"
          git push origin HEAD:feat/surface-unit-v2
