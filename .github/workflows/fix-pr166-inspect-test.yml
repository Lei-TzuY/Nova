name: PR166 inspect assertion fixer

on:
  push:
    branches:
      - feat/closures-lexical-capture

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/closures-lexical-capture
      - name: Update stale callable-ownership assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/nova-inspect/src/lib.rs')
          text = p.read_text()
          old = 'assert!(error.message().contains("crosses function ownership"));'
          new = 'assert!(\n            error\n                .message()\n                .contains("crosses callable ownership without a capture")\n        );'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one stale function-ownership assertion')
          p.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/fix-pr166-inspect-test.yml
          git diff --check
      - name: Commit assertion repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: update callable ownership diagnostic contract"
          git push origin HEAD:feat/closures-lexical-capture
