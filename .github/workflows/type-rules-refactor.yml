name: Apply type-rules refactor

on:
  push:
    branches:
      - refactor/type-rules

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/type-rules
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply focused refactor
        run: python3 scripts/apply_type_rules_refactor.py
      - name: Validate semantic crate
        run: |
          cargo fmt --all
          cargo test -p nova-sema --all-targets --locked
          cargo clippy -p nova-sema --all-targets --all-features -- -D warnings
      - name: Commit refactor and remove helpers
        run: |
          rm .github/workflows/type-rules-refactor.yml
          rm scripts/apply_type_rules_refactor.py
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "refactor: centralize semantic type rules"
          git push origin HEAD:refactor/type-rules
