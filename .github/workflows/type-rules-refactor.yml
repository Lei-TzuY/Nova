name: Apply type-rules refactor

on:
  push:
    branches:
      - refactor/type-rules

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/type-rules
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply focused refactor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_type_rules_refactor.py")
          text = path.read_text()
          old = '''patch(
              "crates/nova-sema/src/type_rules.rs",
              "use crate::hir::{RecordId, RecordType, Type};\\n",
              "use crate::hir::Type;\\n",
          )
          '''
          new = '''type_rules = Path("crates/nova-sema/src/type_rules.rs")
          type_rules_text = type_rules.read_text()
          old_import = "use crate::hir::{RecordId, RecordType, Type};\\n"
          if not type_rules_text.startswith(old_import):
              raise SystemExit("type_rules production import is not in the expected position")
          type_rules.write_text(type_rules_text.replace(old_import, "use crate::hir::Type;\\n", 1))
          '''
          if text.count(old) != 1:
              raise SystemExit("type-rules import patch block did not match exactly once")
          path.write_text(text.replace(old, new, 1))
          PY
          python3 scripts/apply_type_rules_refactor.py
      - name: Validate semantic crate
        run: |
          cargo fmt --all
          cargo test -p nova-sema --all-targets --locked
          cargo clippy -p nova-sema --all-targets --all-features -- -D warnings
      - name: Commit refactor and remove helpers
        run: |
          rm .github/workflows/type-rules-refactor.yml
          rm scripts/apply_type_rules_refactor.py
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "refactor: centralize semantic type rules"
          git push origin HEAD:refactor/type-rules
