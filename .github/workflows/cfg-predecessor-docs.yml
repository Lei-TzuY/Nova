name: CFG predecessor canonicality docs

on:
  push:
    branches:
      - fix/cfg-predecessor-canonicality

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cfg-predecessor-canonicality
          fetch-depth: 0
      - name: Apply CFG predecessor canonicality docs
        shell: bash
        run: |
          set -euo pipefail
          python .github/cfg_predecessor_docs.py
          rm .github/cfg_predecessor_docs.py .github/workflows/cfg-predecessor-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: close CFG predecessor canonicality slice'
          git push origin HEAD:fix/cfg-predecessor-canonicality
