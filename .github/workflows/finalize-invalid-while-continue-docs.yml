name: Finalize invalid while continue docs

on:
  push:
    branches: [fix/invalid-while-continue-backedge]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Apply documentation synchronization
        run: python scripts/finalize-invalid-while-continue-docs.py

      - name: Validate focused regression and formatting
        run: |
          cargo fmt --all -- --check
          cargo test -p nova-sema --test invalid_while_continue_flow --locked

      - name: Commit docs and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-invalid-while-continue-docs.yml
          rm scripts/finalize-invalid-while-continue-docs.py
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add -A
          git commit -m 'docs: record invalid while recovery isolation'
          git push origin HEAD:fix/invalid-while-continue-backedge
