name: BIL-37 gate diagnostics

on:
  push:
    branches:
      - conquest/bil-37-explicit-generic-arguments

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Capture stable gates
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings > .github/bil37_clippy.log 2>&1
          clippy_status=$?
          cargo test --workspace --all-targets --locked > .github/bil37_tests.log 2>&1
          test_status=$?
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add .github/bil37_clippy.log .github/bil37_tests.log
          git commit -m "chore: capture BIL-37 gate diagnostics"
          git push origin HEAD:conquest/bil-37-explicit-generic-arguments
          if [ $clippy_status -ne 0 ] || [ $test_status -ne 0 ]; then exit 1; fi
