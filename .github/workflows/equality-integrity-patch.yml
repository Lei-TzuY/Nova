name: Equality integrity patch

on:
  push:
    branches:
      - fix/runtime-equality-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-equality-contract
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply and validate equality integrity patch
        run: |
          python .github/equality-integrity-patch.py
          cargo fmt --all
          cargo test -p nova-sema equality_rules --locked
          cargo test -p nova-interpreter --test equality_integrity --locked
          rm .github/equality-integrity-patch.py
          rm .github/workflows/equality-integrity-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: validate runtime equality admissibility"
          git push origin HEAD:fix/runtime-equality-contract
