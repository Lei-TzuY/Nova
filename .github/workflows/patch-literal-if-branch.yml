name: Patch literal-if branch

on:
  push:
    branches:
      - feat/literal-if-dataflow

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/literal-if-dataflow
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch literal-if semantic flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          path = Path("crates/nova-sema/src/analyzer.rs")
          text = path.read_text()

          arm_marker = "            ast::ExpressionKind::If {"
          start_marker = "                let entry_scopes = self.scopes.clone();"
          end_marker = "                (\n                    ExpressionKind::If {"
          if text.count(arm_marker) != 1:
              raise SystemExit(f"expected one if-expression arm, found {text.count(arm_marker)}")
          arm = text.index(arm_marker)
          start = text.index(start_marker, arm)
          end = text.index(end_marker, start)

          replacement = indent(
              dedent("""\
              let condition_literal = match &condition.kind {
                  ExpressionKind::Boolean(value) => Some(*value),
                  _ => None,
              };
              let entry_scopes = self.scopes.clone();
              let post_condition_loop_stack = self.loop_stack.clone();

              let (then_branch, then_scopes, else_branch, else_scopes) =
                  match condition_literal {
                      Some(true) => {
                          let then_branch = self.lower_block(then_branch, return_type, true);
                          let then_scopes = self.scopes.clone();
                          let then_loop_stack = self.loop_stack.clone();

                          self.scopes = entry_scopes.clone();
                          self.loop_stack = post_condition_loop_stack.clone();
                          let else_branch =
                              self.lower_expression_for_diagnostics(else_branch, return_type);
                          let else_scopes = self.scopes.clone();

                          self.scopes = then_scopes.clone();
                          self.loop_stack = then_loop_stack;
                          (then_branch, then_scopes, else_branch, else_scopes)
                      }
                      Some(false) => {
                          let then_branch =
                              self.lower_block_for_diagnostics(then_branch, return_type, true);
                          let then_scopes = self.scopes.clone();

                          self.scopes = entry_scopes.clone();
                          self.loop_stack = post_condition_loop_stack.clone();
                          let else_branch = self.lower_expression(else_branch, return_type);
                          let else_scopes = self.scopes.clone();
                          (then_branch, then_scopes, else_branch, else_scopes)
                      }
                      None => {
                          let then_branch = self.lower_block(then_branch, return_type, true);
                          let then_scopes = self.scopes.clone();

                          self.scopes = entry_scopes.clone();
                          let else_branch = self.lower_expression(else_branch, return_type);
                          let else_scopes = self.scopes.clone();
                          (then_branch, then_scopes, else_branch, else_scopes)
                      }
                  };

              let joined_type = self.join_branch_types(
                  &then_branch.ty,
                  then_branch.span,
                  &else_branch.ty,
                  else_branch.span,
              );
              let ty = if condition.ty.is_never() {
                  self.scopes = entry_scopes;
                  self.loop_stack = post_condition_loop_stack;
                  Type::Never
              } else {
                  match condition_literal {
                      Some(true) => {
                          self.scopes = then_scopes;
                          if joined_type.is_error() {
                              Type::Error
                          } else {
                              then_branch.ty.clone()
                          }
                      }
                      Some(false) => {
                          self.scopes = else_scopes;
                          if joined_type.is_error() {
                              Type::Error
                          } else {
                              else_branch.ty.clone()
                          }
                      }
                      None => {
                          self.merge_branch_initialization(
                              &entry_scopes,
                              &then_scopes,
                              then_branch.ty.is_never(),
                              &else_scopes,
                              else_branch.ty.is_never(),
                          );
                          joined_type
                      }
                  }
              };
              """),
              "                ",
          )
          text = text[:start] + replacement + text[end:]

          helper_marker = "    fn lower_record_literal("
          helper_name = "    fn lower_block_for_diagnostics("
          if helper_name in text:
              raise SystemExit("diagnostic-only block helper already exists")
          if text.count(helper_marker) != 1:
              raise SystemExit(f"expected one record-literal helper marker, found {text.count(helper_marker)}")
          helper = dedent("""

              fn lower_block_for_diagnostics(
                  &mut self,
                  block: &ast::Block,
                  return_type: &Type,
                  push_scope: bool,
              ) -> hir::Block {
                  let reachable_scopes = self.scopes.clone();
                  let reachable_loop_stack = self.loop_stack.clone();
                  let lowered = self.lower_block(block, return_type, push_scope);
                  self.scopes = reachable_scopes;
                  self.loop_stack = reachable_loop_stack;
                  lowered
              }

          """)
          helper = indent(helper, "    ")
          insert_at = text.index(helper_marker)
          text = text[:insert_at] + helper + text[insert_at:]
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Validate semantic slice
        run: cargo test -p nova-sema --all-targets --locked
      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/nova-sema/src/analyzer.rs
          git commit -m "fix: align literal-if semantic reachability"
          git push origin HEAD:feat/literal-if-dataflow
