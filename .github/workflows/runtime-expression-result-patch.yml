name: Runtime expression result patch

on:
  push:
    branches:
      - fix/runtime-expression-result-integrity
    paths:
      - .github/runtime-expression-result-patch.py
      - .github/workflows/runtime-expression-result-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-expression-result-integrity
          fetch-depth: 0
      - name: Apply focused patch
        run: python .github/runtime-expression-result-patch.py
      - name: Format and commit
        run: |
          cargo fmt --all
          rm .github/runtime-expression-result-patch.py
          rm .github/workflows/runtime-expression-result-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: validate runtime expression results"
          git push origin HEAD:fix/runtime-expression-result-integrity
