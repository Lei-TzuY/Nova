name: Validate CFG normal exit integrity

on:
  push:
    branches: [fix/cfg-normal-exit-integrity]

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Add normal-exit regressions
        run: python scripts/add-cfg-normal-exit-regressions.py

      - name: Compile regression target
        run: cargo test -p nova-sema verifier_rejects_diagnostic_only_normal_exit --locked --no-run

      - name: Confirm normal-exit regression is red
        shell: bash
        run: |
          set -euo pipefail
          if cargo test -p nova-sema verifier_rejects_diagnostic_only_normal_exit --locked; then
            echo "expected diagnostic-only normal-exit regression to fail before the fix" >&2
            exit 1
          fi

      - name: Apply normal-exit integrity invariant
        run: python scripts/apply-cfg-normal-exit-integrity.py

      - name: Validate behavior
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test -p nova-sema verifier_rejects_diagnostic_only_normal_exit --locked
          cargo test -p nova-sema verifier_rejects_unlisted_exit_node --locked
          cargo test -p nova-sema verifier_rejects_successor_after_exit --locked
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo build --workspace --all-targets --locked
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked

      - name: Commit implementation and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/cfg-normal-exit-integrity.yml
          rm scripts/add-cfg-normal-exit-regressions.py
          rm scripts/apply-cfg-normal-exit-integrity.py
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add -A
          git commit -m 'fix: verify CFG normal exit integrity'
          git push origin HEAD:fix/cfg-normal-exit-integrity
